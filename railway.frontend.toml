# railway.frontend.toml — Homegrown Hoops FRONTEND service
#
# In the Railway dashboard → frontend service → Settings → Config file path,
# set this to: railway.frontend.toml
#
# The service root directory should remain "/" (repo root) so the full
# pnpm workspace is available during the build.
#
# Required environment variables for this service:
#   VITE_CLERK_PUBLISHABLE_KEY   — your Clerk publishable key
#   VITE_CLERK_PROXY_URL         — (optional) Clerk proxy URL
#   VITE_API_BASE_URL            — full URL of the Railway API server service
#                                  e.g. https://api-server-production.up.railway.app
#
# Railway automatically passes matching service environment variables as
# Docker build args when they are declared with ARG in Dockerfile.frontend.
# This is how VITE_* vars get baked into the Vite bundle at build time.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.frontend"

[deploy]
# Overrides the Dockerfile CMD — keeps the config self-contained.
# vite preview reads the PORT env var that Railway injects automatically.
startCommand = "pnpm --filter @workspace/homegrown-hoops run serve"
# No healthcheckPath — Railway performs a TCP health check (port open = healthy).
# vite preview always opens the port, so no HTTP health endpoint is needed.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
