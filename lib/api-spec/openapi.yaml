openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Homegrown Hoops Basketball Stats Tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: teams
    description: Team operations
  - name: players
    description: Player operations
  - name: games
    description: Game operations
  - name: stats
    description: Stats operations
  - name: profiles
    description: User profile operations
  - name: admin
    description: Admin operations
  - name: storage
    description: Object storage upload and serving endpoints
  - name: videos
    description: Game video attachment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamBody"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamBody"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (admin only). Cascades to games and stats.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Admin only
        "404":
          description: Not found

  /teams/{id}/stats:
    get:
      operationId: getTeamStats
      tags: [teams]
      summary: Get aggregated stats for a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamStats"

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/stats:
    get:
      operationId: getPlayerStats
      tags: [players]
      summary: Get career stats for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player career stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStats"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
        - name: season
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Log a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}/player-stats:
    get:
      operationId: getGamePlayerStats
      tags: [games]
      summary: Get per-player stats for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-player stats for this game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GamePlayerStat"
    post:
      operationId: upsertGamePlayerStats
      tags: [games]
      summary: Upsert player stats for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UpsertGamePlayerStatBody"
      responses:
        "200":
          description: Updated stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GamePlayerStat"

  /stats/leaders:
    get:
      operationId: getStatLeaders
      tags: [stats]
      summary: Get stat leaders across all players
      responses:
        "200":
          description: Stat leaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatLeaders"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get overall league/homepage stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users with roles (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserListItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{clerkUserId}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Update a user's role (admin only)
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List all public user profiles
      responses:
        "200":
          description: List of user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Profile not found
    post:
      operationId: createMyProfile
      tags: [profiles]
      summary: Create a profile for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserProfileBody"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateMyProfile
      tags: [profiles]
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /profiles/{clerkUserId}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a user profile by Clerk user ID (public)
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Profile not found
    put:
      operationId: updateProfile
      tags: [profiles]
      summary: Admin override — set teamId and verified status for any profile
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "403":
          description: Forbidden
    delete:
      operationId: deleteProfile
      tags: [profiles]
      summary: Admin-only — permanently delete a player profile
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Profile deleted
        "403":
          description: Forbidden
        "404":
          description: Profile not found

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content

  /games/{id}/videos:
    get:
      operationId: listGameVideos
      tags: [videos]
      summary: List videos attached to a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of game videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameVideo"
    post:
      operationId: addGameVideo
      tags: [videos]
      summary: Attach a video to a game (coach or player)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGameVideoBody"
      responses:
        "201":
          description: Video attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameVideo"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /games/{id}/videos/{videoId}:
    delete:
      operationId: deleteGameVideo
      tags: [videos]
      summary: Delete a game video (uploader or admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - city
        - abbreviation
        - wins
        - losses
        - primaryColor
        - secondaryColor
        - createdAt

    CreateTeamBody:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string
      required:
        - name
        - city
        - abbreviation
        - primaryColor
        - secondaryColor

    UpdateTeamBody:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string

    TeamStats:
      type: object
      properties:
        teamId:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        avgPoints:
          type: number
        avgPointsAllowed:
          type: number
        totalGames:
          type: integer
      required:
        - teamId
        - wins
        - losses
        - avgPoints
        - avgPointsAllowed
        - totalGames

    Player:
      type: object
      properties:
        id:
          type: integer
        teamId:
          type: ["integer", "null"]
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        heightFt:
          type: ["integer", "null"]
        heightIn:
          type: ["integer", "null"]
        weightLbs:
          type: ["integer", "null"]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - firstName
        - lastName
        - createdAt

    CreatePlayerBody:
      type: object
      properties:
        teamId:
          type: ["integer", "null"]
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        heightFt:
          type: ["integer", "null"]
        heightIn:
          type: ["integer", "null"]
        weightLbs:
          type: ["integer", "null"]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
      required:
        - firstName
        - lastName

    UpdatePlayerBody:
      type: object
      properties:
        teamId:
          type: ["integer", "null"]
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        heightFt:
          type: ["integer", "null"]
        heightIn:
          type: ["integer", "null"]
        weightLbs:
          type: ["integer", "null"]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]

    PlayerStats:
      type: object
      properties:
        playerId:
          type: integer
        gamesPlayed:
          type: integer
        totalPoints:
          type: integer
        totalRebounds:
          type: integer
        totalAssists:
          type: integer
        totalSteals:
          type: integer
        totalBlocks:
          type: integer
        totalTurnovers:
          type: integer
        totalThreesMade:
          type: integer
        avgPoints:
          type: number
        avgRebounds:
          type: number
        avgAssists:
          type: number
        avgThreesMade:
          type: number
        avgSteals:
          type: number
        avgBlocks:
          type: number
        avgTurnovers:
          type: number
        avgMinutes:
          type: number
        fieldGoalPct:
          type: number
        threePointPct:
          type: number
        freeThrowPct:
          type: number
      required:
        - playerId
        - gamesPlayed
        - totalPoints
        - totalRebounds
        - totalAssists
        - totalSteals
        - totalBlocks
        - totalTurnovers
        - totalThreesMade
        - avgPoints
        - avgRebounds
        - avgAssists
        - avgThreesMade
        - avgSteals
        - avgBlocks
        - avgTurnovers
        - avgMinutes
        - fieldGoalPct
        - threePointPct
        - freeThrowPct

    Game:
      type: object
      properties:
        id:
          type: integer
        homeTeamId:
          type: integer
        awayTeamId:
          type: integer
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        gameDate:
          type: string
        season:
          type: string
        location:
          type: ["string", "null"]
        status:
          type: string
          enum: [scheduled, in_progress, final]
        notes:
          type: ["string", "null"]
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
          description: "Ordered list of external video links for this game."
        createdAt:
          type: string
      required:
        - id
        - homeTeamId
        - awayTeamId
        - gameDate
        - season
        - status
        - externalLinks
        - createdAt

    CreateGameBody:
      type: object
      properties:
        homeTeamId:
          type: integer
        awayTeamId:
          type: integer
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        gameDate:
          type: string
        season:
          type: string
        location:
          type: ["string", "null"]
        status:
          type: string
          enum: [scheduled, in_progress, final]
        notes:
          type: ["string", "null"]
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
      required:
        - homeTeamId
        - awayTeamId
        - gameDate
        - season
        - status

    UpdateGameBody:
      type: object
      properties:
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        gameDate:
          type: string
        season:
          type: string
        location:
          type: ["string", "null"]
        status:
          type: string
          enum: [scheduled, in_progress, final]
        notes:
          type: ["string", "null"]
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"

    GamePlayerStat:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        playerId:
          type: integer
        points:
          type: integer
          nullable: true
        rebounds:
          type: integer
          nullable: true
        assists:
          type: integer
          nullable: true
        steals:
          type: integer
          nullable: true
        blocks:
          type: integer
          nullable: true
        turnovers:
          type: integer
          nullable: true
        minutesPlayed:
          type: integer
        fieldGoalsMade:
          type: integer
        fieldGoalsAttempted:
          type: integer
        threesMade:
          type: integer
          nullable: true
        threesAttempted:
          type: integer
        freeThrowsMade:
          type: integer
        freeThrowsAttempted:
          type: integer
      required:
        - id
        - gameId
        - playerId
        - points
        - rebounds
        - assists
        - steals
        - blocks
        - turnovers
        - minutesPlayed
        - fieldGoalsMade
        - fieldGoalsAttempted
        - threesMade
        - threesAttempted
        - freeThrowsMade
        - freeThrowsAttempted

    UpsertGamePlayerStatBody:
      type: object
      properties:
        playerId:
          type: integer
        points:
          type: integer
        rebounds:
          type: integer
        assists:
          type: integer
        steals:
          type: integer
        blocks:
          type: integer
        turnovers:
          type: integer
        minutesPlayed:
          type: integer
        fieldGoalsMade:
          type: integer
        fieldGoalsAttempted:
          type: integer
        threesMade:
          type: integer
        threesAttempted:
          type: integer
        freeThrowsMade:
          type: integer
        freeThrowsAttempted:
          type: integer
      required:
        - playerId
        - points
        - rebounds
        - assists
        - steals
        - blocks
        - turnovers
        - minutesPlayed
        - fieldGoalsMade
        - fieldGoalsAttempted
        - threesMade
        - threesAttempted
        - freeThrowsMade
        - freeThrowsAttempted

    StatLeaders:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/PlayerLeaderEntry"
        rebounds:
          type: array
          items:
            $ref: "#/components/schemas/PlayerLeaderEntry"
        assists:
          type: array
          items:
            $ref: "#/components/schemas/PlayerLeaderEntry"
        steals:
          type: array
          items:
            $ref: "#/components/schemas/PlayerLeaderEntry"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PlayerLeaderEntry"
      required:
        - points
        - rebounds
        - assists
        - steals
        - blocks

    PlayerLeaderEntry:
      type: object
      properties:
        playerId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        teamName:
          type: ["string", "null"]
        teamAbbreviation:
          type: ["string", "null"]
        value:
          type: number
      required:
        - playerId
        - firstName
        - lastName
        - value

    StatsSummary:
      type: object
      properties:
        totalTeams:
          type: integer
        totalPlayers:
          type: integer
        totalGames:
          type: integer
        totalGamesCompleted:
          type: integer
        recentGames:
          type: array
          items:
            $ref: "#/components/schemas/Game"
      required:
        - totalTeams
        - totalPlayers
        - totalGames
        - totalGamesCompleted
        - recentGames

    UserRole:
      type: string
      enum: [admin, coach, player]

    ExternalLink:
      type: object
      properties:
        label:
          type: string
          description: "Human-readable label for this link, e.g. 'First Half' or 'Full Game'."
        url:
          type: string
          description: "Full URL to the external video."
      required:
        - label
        - url

    RecognitionEntry:
      type: object
      properties:
        id:
          type: string
        earnedAt:
          type: string
        season:
          type: string
          description: Season this recognition was earned in, e.g. "2025-26". Present on tides awarded from the 2025-26 season onward.
      required:
        - id
        - earnedAt

    ArchetypeHistoryEntry:
      type: object
      properties:
        season:
          type: string
        archetype:
          type: string
      required:
        - season
        - archetype

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        school:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        graduationYear:
          type: ["integer", "null"]
        bio:
          type: ["string", "null"]
        teamId:
          type: ["integer", "null"]
        verified:
          type: boolean
        isAdmin:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        avatarUrl:
          type: ["string", "null"]
        number:
          type: ["string", "null"]
          description: "Player jersey number"
        stamps:
          type: array
          items:
            $ref: "#/components/schemas/RecognitionEntry"
        tides:
          type: array
          items:
            $ref: "#/components/schemas/RecognitionEntry"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/RecognitionEntry"
          description: "Career milestone achievements. Each entry is awarded once when a career stat threshold is crossed."
        archetype:
          type: ["string", "null"]
        archetypeHistory:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ArchetypeHistoryEntry"
          description: "Per-season archetype history, archived at season end."
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - clerkUserId
        - firstName
        - lastName
        - verified
        - isAdmin
        - role
        - stamps
        - tides
        - milestones
        - createdAt
        - updatedAt

    UpdateUserRoleBody:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
      required:
        - role

    AdminUserListItem:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        isAdmin:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - clerkUserId
        - firstName
        - lastName
        - role
        - isAdmin
        - createdAt

    CreateUserProfileBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        school:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        graduationYear:
          type: ["integer", "null"]
        bio:
          type: ["string", "null"]
        teamId:
          type: ["integer", "null"]
      required:
        - firstName
        - lastName

    UpdateUserProfileBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        school:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        graduationYear:
          type: ["integer", "null"]
        bio:
          type: ["string", "null"]
        teamId:
          type: ["integer", "null"]

    AdminUpdateProfileBody:
      type: object
      properties:
        teamId:
          type: ["integer", "null"]
        verified:
          type: boolean

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string

    GameVideo:
      type: object
      required: [id, gameId, uploaderClerkUserId, uploaderName, title, objectPath, createdAt]
      properties:
        id:
          type: integer
        gameId:
          type: integer
        uploaderClerkUserId:
          type: string
        uploaderName:
          type: string
        title:
          type: string
        objectPath:
          type: string
        createdAt:
          type: string

    AddGameVideoBody:
      type: object
      required: [title, objectPath]
      properties:
        title:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
