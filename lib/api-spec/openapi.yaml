openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Homegrown Hoops Basketball Stats Tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: teams
    description: Team operations
  - name: players
    description: Player operations
  - name: games
    description: Game operations
  - name: stats
    description: Stats operations
  - name: profiles
    description: User profile operations
  - name: admin
    description: Admin operations
  - name: storage
    description: Object storage upload and serving endpoints
  - name: videos
    description: Game video attachment operations
  - name: arcade
    description: Arcade mini-game operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamBody"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamBody"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (admin only). Cascades to games and stats.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Admin only
        "404":
          description: Not found

  /teams/{id}/stats:
    get:
      operationId: getTeamStats
      tags: [teams]
      summary: Get aggregated stats for a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamStats"

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/stats:
    get:
      operationId: getPlayerStats
      tags: [players]
      summary: Get career stats for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player career stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStats"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
        - name: season
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Log a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}/player-stats:
    get:
      operationId: getGamePlayerStats
      tags: [games]
      summary: Get per-player stats for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-player stats for this game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GamePlayerStat"
    post:
      operationId: upsertGamePlayerStats
      tags: [games]
      summary: Upsert player stats for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UpsertGamePlayerStatBody"
      responses:
        "200":
          description: Updated stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GamePlayerStat"

  /stats/leaders:
    get:
      operationId: getStatLeaders
      tags: [stats]
      summary: Get stat leaders across all players
      responses:
        "200":
          description: Stat leaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatLeaders"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get overall league/homepage stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users with roles (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserListItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{clerkUserId}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Update a user's role (admin only)
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found

  /admin/jersey-stubs:
    get:
      operationId: listJerseyStubs
      tags: [admin]
      summary: List all unclaimed jersey stubs with accumulated stats (admin only)
      responses:
        "200":
          description: List of jersey stubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JerseyStub"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{clerkUserId}/claim-jersey:
    post:
      operationId: claimJerseyNumber
      tags: [admin]
      summary: Assign a jersey stub to a registered user (admin only)
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimJerseyBody"
      responses:
        "200":
          description: Jersey claimed; recognition triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid request or stub already claimed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User or stub not found

  /admin/pending-accounts:
    get:
      operationId: listPendingAccounts
      tags: [admin]
      summary: List accounts awaiting approval (parent/manager signups)
      responses:
        "200":
          description: List of pending accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingAccountItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/pending-accounts/{clerkUserId}/approve:
    post:
      operationId: approvePendingAccount
      tags: [admin]
      summary: Approve a pending account (sets role to requestedRole, clears isPending)
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAccountItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Account not found

  /admin/pending-accounts/{clerkUserId}/reject:
    post:
      operationId: rejectPendingAccount
      tags: [admin]
      summary: Reject a pending account (clears isPending, keeps as player)
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAccountItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Account not found

  /track-game/submit:
    post:
      operationId: submitTrackGame
      tags: [games]
      summary: Submit a tracked game (manager or admin). Admins bypass approval; managers go to pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTrackGameBody"
      responses:
        "201":
          description: Game submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /admin/pending-games:
    get:
      operationId: listPendingGames
      tags: [admin]
      summary: List all pending games with player stats (admin only)
      responses:
        "200":
          description: List of pending game reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingGameReview"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/pending-games/{id}/approve:
    post:
      operationId: approvePendingGame
      tags: [admin]
      summary: Approve a pending game (marks final, triggers recognition)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game approved and marked final
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Game not found

  /admin/pending-games/{id}/reject:
    post:
      operationId: rejectPendingGame
      tags: [admin]
      summary: Reject a pending game with a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPendingGameBody"
      responses:
        "200":
          description: Game rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Game not found

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List all public user profiles
      responses:
        "200":
          description: List of user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Profile not found
    post:
      operationId: createMyProfile
      tags: [profiles]
      summary: Create a profile for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserProfileBody"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateMyProfile
      tags: [profiles]
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /profiles/{clerkUserId}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a user profile by Clerk user ID (public)
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Profile not found
    put:
      operationId: updateProfile
      tags: [profiles]
      summary: Admin override — set teamId and verified status for any profile
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "403":
          description: Forbidden
    delete:
      operationId: deleteProfile
      tags: [profiles]
      summary: Admin-only — permanently delete a player profile
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Profile deleted
        "403":
          description: Forbidden
        "404":
          description: Profile not found

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content

  /games/{id}/videos:
    get:
      operationId: listGameVideos
      tags: [videos]
      summary: List videos attached to a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of game videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameVideo"
    post:
      operationId: addGameVideo
      tags: [videos]
      summary: Attach a video to a game (coach or player)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGameVideoBody"
      responses:
        "201":
          description: Video attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameVideo"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /games/{id}/videos/{videoId}:
    delete:
      operationId: deleteGameVideo
      tags: [videos]
      summary: Delete a game video (uploader or admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /profiles/me/avatar-config:
    patch:
      operationId: saveAvatarConfig
      tags: [profiles]
      summary: Save avatar config for current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAvatarConfigBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
        "404":
          description: Profile not found

  /arcade/sessions:
    post:
      operationId: postArcadeSession
      tags: [arcade]
      summary: Submit an arcade game session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostArcadeSessionBody"
      responses:
        "201":
          description: Session saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeSession"
        "401":
          description: Unauthorized

  /arcade/my-stats:
    get:
      operationId: getMyArcadeStats
      tags: [arcade]
      summary: Get current user best arcade stats per game
      responses:
        "200":
          description: Best stats per game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyArcadeStats"
        "401":
          description: Unauthorized

  /arcade/my-rank:
    get:
      operationId: getMyArcadeRank
      tags: [arcade]
      summary: Get current user rank for a specific game
      parameters:
        - name: game
          in: query
          required: true
          schema:
            type: string
            enum: [fast-break, who-ya-got, shot-clock]
      responses:
        "200":
          description: User rank for the given game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRank"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - city
        - abbreviation
        - wins
        - losses
        - primaryColor
        - secondaryColor
        - createdAt

    CreateTeamBody:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string
      required:
        - name
        - city
        - abbreviation
        - primaryColor
        - secondaryColor

    UpdateTeamBody:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string

    TeamStats:
      type: object
      properties:
        teamId:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        avgPoints:
          type: number
        avgPointsAllowed:
          type: number
        totalGames:
          type: integer
      required:
        - teamId
        - wins
        - losses
        - avgPoints
        - avgPointsAllowed
        - totalGames

    Player:
      type: object
      properties:
        id:
          type: integer
        teamId:
          type: ["integer", "null"]
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        heightFt:
          type: ["integer", "null"]
        heightIn:
          type: ["integer", "null"]
        weightLbs:
          type: ["integer", "null"]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        isJerseyStub:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - firstName
        - lastName
        - isJerseyStub
        - createdAt

    CreatePlayerBody:
      type: object
      properties:
        teamId:
          type: ["integer", "null"]
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["string", "null"]
        position:
