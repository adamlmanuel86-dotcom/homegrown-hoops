<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Drive The Lane</title>
<style>
  html,body{margin:0;padding:0;background:#0f1b2d;overflow:hidden;height:100%;font-family:'Arial Black',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  #game{width:100%;height:100%;}
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;pointer-events:none;z-index:5;}
  .pill{background:rgba(15,27,45,0.75);border:2px solid #ff7a1a;border-radius:20px;padding:6px 12px;color:#fff;font-size:12px;letter-spacing:1px;white-space:nowrap;transition:border-color 0.2s;}
  #lives{display:flex;gap:6px;}
  .life{width:14px;height:14px;border-radius:50%;background:#ff7a1a;box-shadow:0 0 6px #ff7a1a;}
  .life.dead{background:#3a4a63;box-shadow:none;}
  #scorePill{background:rgba(15,27,45,0.75);border:2px solid #ffd23f;border-radius:20px;padding:6px 14px;color:#ffd23f;font-size:14px;font-weight:900;letter-spacing:1px;white-space:nowrap;}
  #controls{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;z-index:5;}
  .lr{display:flex;flex:1;gap:8px;align-items:center;justify-content:center;align-self:center;}
  .btn{flex:1;padding:14px 4px;border-radius:14px;border:none;color:#fff;font-weight:900;font-size:13px;letter-spacing:0.5px;text-transform:uppercase;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,0.35);touch-action:manipulation;}
  .btn:active{transform:translateY(3px);box-shadow:none;}
  #left,#right{background:#22314f;width:50px;height:50px;flex:none;padding:0;box-sizing:border-box;border-radius:12px;}
  #moveGroup{position:relative;width:196px;height:196px;flex:0 0 196px;}
  .moveBtn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,0.9);color:#fff;font-weight:900;font-size:10px;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;text-shadow:0 1px 3px rgba(0,0,0,0.5);box-shadow:inset 0 3px 5px rgba(255,255,255,0.35),inset 0 -4px 6px rgba(0,0,0,0.3),0 5px 0 rgba(0,0,0,0.4),0 6px 10px rgba(0,0,0,0.3);}
  .moveBtn:active{transform:translateY(4px) scale(0.96);box-shadow:inset 0 3px 5px rgba(255,255,255,0.25),inset 0 -2px 4px rgba(0,0,0,0.25),0 1px 0 rgba(0,0,0,0.4);}
  #spin{width:46px;height:46px;left:75px;top:0;background:#2f6fed;display:none;}
  #hesi{width:46px;height:46px;right:0;top:75px;background:#ff3b3b;display:none;}
  #behindback{width:46px;height:46px;left:75px;bottom:0;background:#2ecc71;display:none;}
  #inandout{width:46px;height:46px;left:0;top:75px;background:#9b59b6;display:none;}
  #crossover{width:68px;height:68px;left:64px;top:64px;background:#ff7a1a;font-size:12px;}
  #shoot{flex:1.3;width:76px;height:76px;border-radius:50%;background:#35d07f;display:none;align-self:center;margin:0 auto;border:3px solid rgba(255,255,255,0.85);color:#fff;font-weight:900;font-size:13px;box-shadow:0 0 16px rgba(53,208,127,0.8),0 4px 0 rgba(0,0,0,0.35);align-items:center;justify-content:center;touch-action:manipulation;padding:0;animation:shootPulse 0.9s infinite;}
  @keyframes shootPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  #comboBtn{position:fixed;right:14px;top:92px;z-index:6;display:none;background:linear-gradient(135deg,#ffd23f,#ff7a1a);border:3px solid #fff;color:#1a1a1a;font-weight:900;font-size:12px;padding:0;border-radius:50%;width:64px;height:64px;box-shadow:0 0 18px #ffd23f,0 4px 0 rgba(0,0,0,0.35);touch-action:manipulation;animation:comboPulse 1s infinite;}
  @keyframes comboPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  #overlay{position:fixed;inset:0;background:rgba(10,16,28,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;text-align:center;padding:20px;}
  #overlay h1{font-size:26px;margin:0 0 6px;color:#ff7a1a;}
  #overlay p{margin:2px 0;font-size:14px;color:#c9d3e0;}
  #overlay button{margin-top:18px;background:#ff7a1a;border:none;color:#fff;padding:12px 28px;border-radius:24px;font-weight:900;font-size:15px;letter-spacing:1px;}
  #boxScore{margin-top:14px;width:220px;background:rgba(0,0,0,0.35);border:2px solid #ff7a1a;border-radius:10px;padding:10px 14px;font-family:'Courier New',monospace;}
  .bsRow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#e8edf5;letter-spacing:0.5px;}
  .bsRow span:first-child{color:#8a97ad;font-weight:700;}
  .bsRow span:last-child{font-weight:900;color:#ffd23f;}
  #banner{position:fixed;top:38%;left:0;right:0;text-align:center;color:#fff;font-size:24px;font-weight:900;letter-spacing:2px;pointer-events:none;z-index:6;text-shadow:0 2px 8px rgba(0,0,0,0.6);opacity:0;}
  #prompt{position:fixed;top:50%;left:0;right:0;text-align:center;color:#35d07f;font-size:15px;font-weight:900;letter-spacing:1px;pointer-events:none;z-index:6;opacity:0;transition:opacity 0.15s;text-shadow:0 2px 6px rgba(0,0,0,0.7);}
  #shotMeter{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);width:240px;height:18px;background:rgba(15,27,45,0.85);border:2px solid #35d07f;border-radius:9px;display:none;z-index:6;overflow:hidden;}
  #shotMeterZone{position:absolute;top:0;bottom:0;background:rgba(53,208,127,0.45);}
  #shotMeterMark{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff;}
  #titleCard{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(10,16,28,0.5);z-index:4;opacity:0;transition:opacity 0.3s;pointer-events:none;}
  #titleCard h2{font-size:24px;margin:0;letter-spacing:2px;color:#ff7a1a;text-shadow:0 2px 8px rgba(0,0,0,0.6);}
  #titleCard span{font-size:13px;color:#c9d3e0;margin-top:4px;letter-spacing:1px;}
  #hooperSelectUI{position:fixed;inset:0;z-index:7;pointer-events:none;}
  #hooperButtonBar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,#0f1b2d 55%,rgba(15,27,45,0));padding:22px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:auto;}
  .hooperPickRow{display:flex;gap:10px;width:100%;max-width:420px;}
  .hooperPickBtn{flex:1;background:#ff7a1a;border:none;color:#fff;font-weight:900;font-size:12px;letter-spacing:0.3px;padding:13px 4px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,0.35);touch-action:manipulation;-webkit-touch-callout:none;user-select:none;}
  .hooperPickBtn:active{transform:translateY(2px);box-shadow:none;}
  #hooperLocked{text-align:center;color:#5a6a80;font-weight:900;font-size:11px;letter-spacing:0.5px;background:rgba(22,40,63,0.7);padding:10px 16px;border-radius:12px;pointer-events:none;transition:background 0.2s,border-color 0.2s,color 0.2s;border:1px solid transparent;}
  #hooperLocked span{display:block;font-weight:400;font-size:9px;margin-top:3px;letter-spacing:0.3px;}
  #hooperLocked.ready{pointer-events:auto;cursor:pointer;background:rgba(255,122,26,0.18);border-color:rgba(255,122,26,0.6);color:#ff9944;}
  #hooperLocked.ready:active{background:rgba(255,122,26,0.32);}
  #hooperShuffle{background:#22314f;border:none;color:#fff;font-weight:900;font-size:14px;letter-spacing:0.5px;padding:13px 26px;border-radius:24px;box-shadow:0 4px 0 rgba(0,0,0,0.35);pointer-events:auto;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;}
  #hooperShuffle:active{transform:translateY(3px);box-shadow:none;}
  #hypeBar{position:fixed;top:78px;left:14px;right:14px;height:7px;background:rgba(15,27,45,0.6);border-radius:4px;overflow:hidden;z-index:5;border:1px solid rgba(255,255,255,0.15);transition:box-shadow 0.2s;}
  #hypeFill{height:100%;width:0%;background:linear-gradient(90deg,#ff7a1a,#ffd23f);transition:width 0.2s;}
  #hypeBar.clutch{box-shadow:0 0 10px #ffd23f, 0 0 18px #ffd23f;}
  #hypeBar.clutch #hypeFill{background:#ffd23f;}
  #bossHP{position:fixed;top:90px;left:14px;right:14px;z-index:5;display:none;}
  #bossHPLabel{color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,0.8);margin-bottom:3px;text-align:center;}
  #bossHPBar{height:12px;background:rgba(15,27,45,0.7);border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,0.25);}
  #bossHPFill{height:100%;width:100%;transition:width 0.35s cubic-bezier(.2,.9,.4,1);}
  #bossPrompt{position:fixed;z-index:8;display:none;width:84px;height:84px;touch-action:manipulation;animation:bossPromptPop 0.2s ease-out;}
  @keyframes bossPromptPop{0%{transform:scale(0.4);}100%{transform:scale(1);}}
  #bossPromptRing{width:100%;height:100%;border-radius:50%;padding:6px;box-sizing:border-box;box-shadow:0 4px 16px rgba(0,0,0,0.5);}
  #bossPromptInner{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px;letter-spacing:0.5px;border:3px solid rgba(255,255,255,0.85);}
</style>
</head>
<body>
<div id="hud">
  <div class="pill">LEVEL <span id="lvl">1</span></div>
  <div id="scorePill">SCORE <span id="scoreVal">0</span></div>
  <div class="pill" id="themePill" style="display:none;">THEME <span id="theme">STREETBALL</span></div>
  <div class="pill" id="streakPill" style="display:none;">STREAK <span id="streakVal">0</span></div>
  <div class="pill" id="dodgePill" style="display:none;border-color:#35d0e8;">BLOW BY <span id="dodgeVal">0</span></div>
  <div id="lives"></div>
</div>
<div id="hypeBar"><div id="hypeFill"></div></div>
<div id="bossHP"><div id="bossHPLabel"></div><div id="bossHPBar"><div id="bossHPFill"></div></div></div>
<div id="bossPrompt"><div id="bossPromptRing"><div id="bossPromptInner"></div></div></div>
<div id="banner"></div>
<div id="prompt">PAINT PACKED — PULL UP FOR 3?</div>
<div id="shotMeter"><div id="shotMeterZone"></div><div id="shotMeterMark"></div></div>
<div id="titleCard"></div>
<div id="hooperSelectUI" style="display:none;">
  <div id="hooperButtonBar">
    <div class="hooperPickRow">
      <button class="hooperPickBtn" id="hooperPick0">PICK</button>
      <button class="hooperPickBtn" id="hooperPick1">PICK</button>
      <button class="hooperPickBtn" id="hooperPick2">PICK</button>
    </div>
    <button id="hooperShuffle">🎲 SHUFFLE HOOPERS</button>
    <div id="hooperLocked">🔒 USE MY OWN AVATAR<br><span>(coming once the avatar creator is wired in)</span></div>
  </div>
</div>
<div id="game"></div>
<button id="comboBtn">COMBO!</button>
<div id="controls">
  <div class="lr">
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
  </div>
  <div id="moveGroup">
    <button class="moveBtn" id="spin">SPIN</button>
    <button class="moveBtn" id="hesi">HESI</button>
    <button class="moveBtn" id="behindback">BACK</button>
    <button class="moveBtn" id="inandout">I/O</button>
    <button class="moveBtn" id="crossover">CROSS</button>
  </div>
  <button id="shoot">3PT</button>
</div>
<div id="overlay">
  <h1 id="ovTitle">SCORE!</h1>
  <p id="ovSub">Level complete</p>
  <div id="boxScore">
    <div class="bsRow"><span>SCORE</span><span id="bsScore">0</span></div>
    <div class="bsRow"><span>PTS</span><span id="bsPts">0</span></div>
    <div class="bsRow"><span>FG</span><span id="bsFG">0-0</span></div>
    <div class="bsRow"><span>FG%</span><span id="bsFGPct">.000</span></div>
    <div class="bsRow"><span>3PT</span><span id="bs3PT">0-0</span></div>
    <div class="bsRow"><span>3PT%</span><span id="bs3PTPct">.000</span></div>
    <div class="bsRow"><span>BEST STREAK</span><span id="bsStreak">0</span></div>
  </div>
  <button id="ovBtn">Next Level</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script>
// ---------- Config ----------
const W = 420, H = 720;
const PLAYER_Y = H - 170;
const LANES = [W*0.26, W*0.5, W*0.74];
const INPUT_BUFFER_MS = 220;
const ARC_BOW = 42; // how far the 3PT line bows toward the player at center court

let level = 1;
let selectedHooperPalette = null; // chosen on the "Choose Your Hooper" screen — persists for the session
let receivedAvatarPalette = null; // sent from the React wrapper via postMessage when user has a saved avatar
let selectedHooperName = '';
let sessionBestStreak = 0;
let stats = { fgm: 0, fga: 0, tpm: 0, tpa: 0, dunks: 0, points: 0 }; // session box score — resets on reload; career persistence needs the real backend
let lives = 3;
let queuedMove = null; // { move, ts } — buffered like before
let superReady = false; // banked "Combo!" super move — persists across levels until used
let nextSuperThreshold = 8; // streak needed to earn the next super
let streak = 0; // persists across level transitions — only resets on an actual strip
let dodgeStreak = 0; // separate streak for clean dodges (lane play), rewards points only — kept distinct from the move streak
let cachedCfg = null; // reused across retries of the same level so a checkpoint retry isn't re-randomized
let cachedCfgLevel = null;
let checkpointReached = false; // resets when actually advancing to a new level, not on retry
let score = 0; // arcade running score, boosted by perfect moves and streak multiplier — resets on a full "benched" game over
let totalTurnovers = 0; // session-wide turnover count — hitting the bench threshold ends the run
const BENCH_THRESHOLD = 5;

const MOVES = { CROSSOVER: 'CROSSOVER', SPIN: 'SPIN', HESI: 'HESI', BEHINDBACK: 'BEHINDBACK', INANDOUT: 'INANDOUT' };
// visual tell lives on the defender's pose (one hand = cross, both hands = spin,
// neutral/flat-footed = hesi, low reach = behind-the-back, wide stagger = in-and-out)
// plus a color-coded glow behind them.
const MOVE_COLOR = { CROSSOVER: 0xff7a1a, SPIN: 0x2f6fed, HESI: 0xff3b3b, BEHINDBACK: 0x2ecc71, INANDOUT: 0x9b59b6 };

// progressive unlock: Crossover to start, then one new move per boss —
// Spin (boss@5), Hesi (boss@10), Behind-the-Back (boss@15), In-and-Out (boss@20/Championship)
function unlockedMoves(n){
  const m = [MOVES.CROSSOVER];
  if (n > 5) m.push(MOVES.SPIN);
  if (n > 10) m.push(MOVES.HESI);
  if (n > 15) m.push(MOVES.BEHINDBACK);
  if (n > 20) m.push(MOVES.INANDOUT);
  return m;
}
function moveSuffix(move){
  if (move === MOVES.CROSSOVER) return '_cross';
  if (move === MOVES.SPIN) return '_spin';
  if (move === MOVES.HESI) return '_hesi';
  if (move === MOVES.BEHINDBACK) return '_bhb';
  return '_inout';
}

// each move unlocks the level right after its boss; used to trigger the "new move" announcement
const NEW_MOVE_AT_LEVEL = { 6: MOVES.SPIN, 11: MOVES.HESI, 16: MOVES.BEHINDBACK, 21: MOVES.INANDOUT };
const MOVE_FULLNAME = { CROSSOVER: 'Crossover', SPIN: 'Spin', HESI: 'Hesitation', BEHINDBACK: 'Behind-the-Back', INANDOUT: 'In-and-Out' };
const MOVE_ABBR = { CROSSOVER: 'CROSS', SPIN: 'SPIN', HESI: 'HESI', BEHINDBACK: 'BACK', INANDOUT: 'I/O' };

// tournament framing — bosses land at 5/10/15/20, which map to playoff rounds;
// the cycle repeats as a new "season" once you win the championship
function roundInfo(n){
  const season = Math.floor((n-1)/20) + 1;
  const pos = ((n-1) % 20) + 1; // 1..20
  let name;
  if (pos <= 4) name = 'FIRST ROUND';
  else if (pos === 5) name = 'FIRST ROUND — BOSS';
  else if (pos <= 9) name = 'QUARTERFINALS';
  else if (pos === 10) name = 'QUARTERFINALS — BOSS';
  else if (pos <= 14) name = 'SEMIFINALS';
  else if (pos === 15) name = 'SEMIFINALS — BOSS';
  else if (pos <= 19) name = 'CHAMPIONSHIP';
  else name = 'CHAMPIONSHIP — FINAL BOSS';
  return { season, name, isFinalBoss: pos === 20 };
}

// running arcade score — boosted by streak (every 5 in a row adds +50% multiplier)
function addScore(base){
  const mult = 1 + Math.floor(streak/5)*0.5;
  score += Math.round(base*mult);
  const el = document.getElementById('scoreVal');
  if (el) el.textContent = score;
}

// ---------- Audio: synthesized tones, no asset files needed ----------
let audioCtx = null;
function ensureAudio(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch(e){ return null; }
}
function playTone(freq, duration, type, gainPeak, sweepTo){
  const ctx = ensureAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, ctx.currentTime + duration);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak||0.2, ctx.currentTime+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+duration+0.02);
}
// filtered white noise — reads as real crowd roar/murmur, not a synthesized tone
function playCrowdNoise(duration, peakGain, filterFreq, type){
  const ctx = ensureAudio();
  if (!ctx) return;
  const bufferSize = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = type || 'bandpass';
  filter.frequency.value = filterFreq;
  filter.Q.value = 0.7;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(peakGain, ctx.currentTime + duration*0.18);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start();
}
function sfxCrowdCheer(big){ playCrowdNoise(big?1.3:0.7, big?0.4:0.25, big?1500:1100, 'bandpass'); }
function sfxCrowdGroan(){ playCrowdNoise(0.55, 0.18, 260, 'lowpass'); }
function sfxCrossover(){ playTone(520, 0.12, 'triangle', 0.18, 300); }
function sfxSpin(){ playTone(300, 0.22, 'sawtooth', 0.14, 700); }
function sfxStrip(){ playTone(120, 0.25, 'square', 0.2, 60); }
function sfxClank(){ playTone(200, 0.15, 'square', 0.14, 140); }
function sfxScore(){ playTone(660, 0.12, 'sine', 0.2, 880); setTimeout(()=>playTone(880, 0.18, 'sine', 0.22, 1180), 90); }
function sfxShift(){ playTone(700, 0.05, 'sine', 0.07); }
function sfxAnkles(){ playTone(150, 0.09, 'square', 0.22, 55); setTimeout(()=>playTone(900, 0.16, 'sine', 0.22, 1300), 70); }
function sfxBossRoar(){ playTone(90, 0.35, 'sawtooth', 0.26, 45); setTimeout(()=>playTone(65, 0.22, 'square', 0.18, 40), 120); }
function sfxBossHit(){ playTone(110, 0.1, 'square', 0.24, 70); }
function sfxHesi(){ playTone(440, 0.06, 'triangle', 0.16); setTimeout(()=>playTone(520, 0.08, 'triangle', 0.16), 70); }
function sfxFreeze(){ playTone(1200, 0.1, 'sine', 0.2, 1600); setTimeout(()=>playTone(700, 0.18, 'sine', 0.2, 300), 90); }
function sfxBehindBack(){ playTone(380, 0.07, 'triangle', 0.16, 620); setTimeout(()=>playTone(300, 0.09, 'triangle', 0.14, 500), 60); }
function sfxInAndOut(){ playTone(500, 0.06, 'sawtooth', 0.14, 260); setTimeout(()=>playTone(500, 0.06, 'sawtooth', 0.14, 700), 80); }

// ---------- Procedural 2D baller (stand-in for the real avatar-creator output) ----------
const BUILDS = { lanky:{w:0.85,h:1.12}, standard:{w:1,h:1}, stocky:{w:1.18,h:0.92} };

// ---------- Choose Your Hooper — random generic builds offered before a run ----------
const HOOPER_NAMES = ['SWIFT','ICE','TANK','FLASH','ROOKIE','VIPER','ACE','GLIDE','JUKE','RIM-RATTLER','BOLT','CHAIN','NOVA','DASH','HAWK','JUKEBOX','THE BLUR','LEFTY'];
const HOOPER_SKINS = [0xf0c9a0, 0xd8a878, 0xc98a5b, 0x8a5a34, 0x6b4226];
const HOOPER_HAIR_STYLES = ['fade','curls','bald','long','afro','mohawk','flattop'];
const HOOPER_HAIR_COLORS = [0x0a0a0a, 0x3a2418, 0x6b4226, 0xd4a843, 0xb33d1f, 0x9a9a9a];
const HOOPER_JERSEYS = [0x14213d, 0xff7a1a, 0xe63946, 0x2f6fed, 0x2ecc71, 0x9b59b6, 0xffd23f, 0x1a1a1a];
const HOOPER_SHORTS = [0x0a0f1e, 0x1a1a1a, 0x2a1f05, 0x1a1230, 0x102a1c];
const HOOPER_BUILDS = ['standard','stocky','lanky'];
const HOOPER_ACCESSORY_COLORS = [0xffffff, 0x1a1a1a, 0xff7a1a, 0xe63946, 0x2f6fed, 0xffd23f];

function randomHooper(){
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const accessories = { headband: Math.random()<0.3, wristbands: Math.random()<0.3, kneepads: Math.random()<0.3 };
  return {
    name: pick(HOOPER_NAMES),
    palette: {
      skin: pick(HOOPER_SKINS),
      jersey: pick(HOOPER_JERSEYS),
      shorts: pick(HOOPER_SHORTS),
      hair: { style: pick(HOOPER_HAIR_STYLES), color: pick(HOOPER_HAIR_COLORS) },
      build: pick(HOOPER_BUILDS),
      accessories, accessoryColor: pick(HOOPER_ACCESSORY_COLORS),
    },
  };
}


// court floor detail — each setting gets a surface that actually looks like
// what it is, not just a recolored flat rectangle
function drawCourtFloor(court, theme, W, H){
  const style = theme.floorStyle;
  if (style === 'hardwood' || style === 'hardwood-glossy'){
    // vertical planks running the length of the court, with alternating shade
    const plankW = 15;
    let i = 0;
    for (let lx=18; lx<W-18; lx+=plankW){
      if (i%2===0){ court.fillStyle(0x000000, 0.09); court.fillRect(lx, H*0.35, plankW, H*0.65); }
      i++;
    }
    court.lineStyle(1, 0x000000, 0.28);
    for (let lx=18; lx<W-18; lx+=plankW){ court.lineBetween(lx, H*0.35, lx, H); }
    // short grain streaks within each plank
    court.lineStyle(1, 0xffffff, 0.11);
    for (let lx=18; lx<W-18; lx+=plankW){
      for (let ly=H*0.4; ly<H; ly+=26){
        court.lineBetween(lx+3, ly+Math.random()*10, lx+plankW-3, ly+Math.random()*10+6);
      }
    }
    // accent-colored key/paint stripe down the lane, like real hardwood courts
    court.fillStyle(theme.accent, 0.05);
    court.fillRect(W/2-52, H*0.35, 104, H*0.65);
    court.lineStyle(2, theme.accent, 0.3);
    court.lineBetween(W/2-52, H*0.35, W/2-52, H);
    court.lineBetween(W/2+52, H*0.35, W/2+52, H);
    if (style === 'hardwood-glossy'){
      // polished-floor light streak
      court.fillStyle(0xffffff, 0.07);
      court.fillTriangle(0, H*0.35, W*0.45, H*0.35, 0, H*0.68);
    }
  } else if (style === 'asphalt' || style === 'pavement'){
    // cracked, patchy surface — pavement (park) gets more wear than asphalt (streetball)
    const crackCount = style === 'pavement' ? 12 : 7;
    const patchCount = style === 'pavement' ? 10 : 6;
    court.fillStyle(0x000000, 0.12);
    for (let i=0;i<patchCount;i++){
      const x = Math.random()*W, y = H*0.4+Math.random()*H*0.55;
      court.fillEllipse(x, y, 35+Math.random()*35, 16+Math.random()*18);
    }
    court.lineStyle(1.3, 0x000000, 0.4);
    for (let i=0;i<crackCount;i++){
      let x = Math.random()*W, y = H*0.38+Math.random()*H*0.55;
      court.beginPath();
      court.moveTo(x, y);
      const segs = 3+Math.floor(Math.random()*3);
      for (let s=0;s<segs;s++){ x += (Math.random()-0.5)*34; y += Math.random()*18; court.lineTo(x, y); }
      court.strokePath();
    }
    // faded accent-colored paint, worn and half-scrubbed-off looking
    court.lineStyle(3, theme.accent, 0.22);
    court.lineBetween(W/2-52, H*0.35, W/2-52, H);
    court.lineBetween(W/2+52, H*0.35, W/2+52, H);
  } else { // concrete — plain driveway/street, subtle expansion-joint grid
    court.lineStyle(1.3, 0x000000, 0.18);
    for (let lx=6; lx<W; lx+=54){ court.lineBetween(lx, H*0.35, lx, H); }
    for (let ly=H*0.4; ly<H; ly+=54){ court.lineBetween(0, ly, W, ly); }
    court.lineStyle(2, theme.accent, 0.25);
    court.lineBetween(W/2-52, H*0.35, W/2-52, H);
    court.lineBetween(W/2+52, H*0.35, W/2+52, H);
  }
}

function drawFan(g, x, y, skinTone, shirtColor, s){
  g.fillStyle(shirtColor, 0.95);
  g.fillRoundedRect(x-1.9*s, y+0.6*s, 3.8*s, 3.2*s, 1*s);
  g.fillStyle(skinTone, 1);
  g.fillCircle(x, y-0.6*s, 1.7*s);
}
const SKIN_TONES = [0xf0c9a0, 0xd8a878, 0xc98a5b, 0x8a5a34, 0x6b4226];

function avatarConfigToGamePalette(cfg) {
  return {
    skin: cfg.skin,
    jersey: cfg.jersey,
    jerseyStyle: cfg.jerseyStyle || 'solid',
    secondaryColor: cfg.secondaryColor || 0xffffff,
    shorts: cfg.shorts,
    hair: { style: cfg.hairStyle || 'fade', color: cfg.hairColor || 0x1a1a1a },
    build: cfg.build || 'standard',
    accessories: cfg.accessories || { headband: false, wristbands: false, kneepads: false },
    accessoryColor: cfg.accessoryColor || 0xffffff,
    expression: { eyebrows: cfg.eyebrows || 'none', mouth: cfg.mouth || 'neutral' },
    glasses: cfg.glasses || 'none',
  };
}

function drawBaller(g, palette, runFrame, armPose, poseColor, showFace){
  const { skin, jersey, shorts, hair, build } = palette;
  const b = BUILDS[build];
  const cx = 22*b.w, legW = 7*b.w, torsoW = 20*b.w, torsoH = 22*b.h;
  const headR = 8.8*b.w;
  const headY = 12*b.h;
  const torsoY = headY + headR + 2;
  const legY = torsoY + torsoH;
  const stride = runFrame===undefined ? 0 : 3;
  const leftLift = runFrame===1 ? stride : 0;
  const rightLift = runFrame===0 ? stride : 0;
  const leftLegH = 14*b.h - leftLift;
  const rightLegH = 14*b.h - rightLift;
  const leanSpread = armPose==='lean' ? 4 : 0; // wide staggered stance, tell for In-and-Out

  g.fillStyle(skin,1);
  g.fillRoundedRect(cx-legW-2-leftLift*0.4-leanSpread, legY+leftLift, legW, leftLegH, 2);
  g.fillRoundedRect(cx+2+rightLift*0.4+leanSpread, legY+rightLift, legW, rightLegH, 2);
  g.fillStyle(0x1c1c1c,1);
  g.fillRoundedRect(cx-legW-3-leftLift*0.4-leanSpread, legY+leftLift+leftLegH-1, legW+2, 5, 2);
  g.fillRoundedRect(cx+1+rightLift*0.4+leanSpread, legY+rightLift+rightLegH-1, legW+2, 5, 2);
  g.fillStyle(shorts,1);
  g.fillRoundedRect(cx-torsoW/2, torsoY+torsoH-8, torsoW/2-1, 17, 2);
  g.fillRoundedRect(cx+1, torsoY+torsoH-8, torsoW/2-1, 17, 2);

  // arms — defenders get a pose that IS the tell: one hand out (cross it), both
  // hands spread high (spin), low reach (behind-the-back), wide stance (in-and-out).
  // each branch records where the wrist actually ends up, so accessories can find it.
  let lWrist, rWrist;
  if (armPose === 'both'){
    g.fillStyle(skin,1);
    g.fillRoundedRect(cx-torsoW/2-15, torsoY+3, 13, 5, 2);
    g.fillRoundedRect(cx+torsoW/2+2, torsoY+3, 13, 5, 2);
    g.fillStyle(poseColor,1);
    g.fillCircle(cx-torsoW/2-15, torsoY+5.5, 4);
    g.fillCircle(cx+torsoW/2+15, torsoY+5.5, 4);
    lWrist = {x:cx-torsoW/2-9, y:torsoY+5, ang:0}; rWrist = {x:cx+torsoW/2+9, y:torsoY+5, ang:0};
  } else if (armPose === 'one'){
    g.fillStyle(skin,1);
    g.fillRoundedRect(cx-torsoW/2-15, torsoY+1, 13, 5, 2);
    g.fillStyle(poseColor,1);
    g.fillCircle(cx-torsoW/2-15, torsoY+3.5, 4);
    g.fillStyle(skin,1);
    g.fillRoundedRect(cx+torsoW/2, torsoY+2, 5, 16*b.h, 2);
    lWrist = {x:cx-torsoW/2-9, y:torsoY+3, ang:0}; rWrist = {x:cx+torsoW/2+2.5, y:torsoY+2+16*b.h*0.68, ang:1};
  } else if (armPose === 'reach'){
    // one arm reaching low and forward — a poke-check attempt
    g.fillStyle(skin,1);
    g.fillRoundedRect(cx-torsoW/2-13, torsoY+torsoH-4, 15, 5, 2);
    g.fillStyle(poseColor,1);
    g.fillCircle(cx-torsoW/2-13, torsoY+torsoH-1.5, 4);
    g.fillStyle(skin,1);
    g.fillRoundedRect(cx+torsoW/2, torsoY+2, 5, 16*b.h, 2);
    lWrist = {x:cx-torsoW/2-8, y:torsoY+torsoH-3, ang:0}; rWrist = {x:cx+torsoW/2+2.5, y:torsoY+2+16*b.h*0.68, ang:1};
  } else if (armPose === 'lean'){
    // both arms low and wide, legs staggered — anticipating a hard cut
    g.fillStyle(skin,1);
    g.fillRoundedRect(cx-torsoW/2-12, torsoY+8, 12, 5, 2);
    g.fillRoundedRect(cx+torsoW/2, torsoY+8, 12, 5, 2);
    g.fillStyle(poseColor,1);
    g.fillCircle(cx-torsoW/2-12, torsoY+10.5, 3.5);
    g.fillCircle(cx+torsoW/2+12, torsoY+10.5, 3.5);
    lWrist = {x:cx-torsoW/2-7, y:torsoY+10, ang:0}; rWrist = {x:cx+torsoW/2+7, y:torsoY+10, ang:0};
  } else {
    g.fillStyle(skin,1);
    g.fillRoundedRect(cx-torsoW/2-5, torsoY+2+rightLift*0.3, 5, 16*b.h, 2);
    g.fillRoundedRect(cx+torsoW/2, torsoY+2+leftLift*0.3, 5, 16*b.h, 2);
    lWrist = {x:cx-torsoW/2-2.5, y:torsoY+2+rightLift*0.3+16*b.h*0.66, ang:1};
    rWrist = {x:cx+torsoW/2+2.5, y:torsoY+2+leftLift*0.3+16*b.h*0.66, ang:1};
  }

  g.fillStyle(jersey,1);
  g.fillRoundedRect(cx-torsoW/2, torsoY, torsoW, torsoH, 5);
  if (palette.jerseyStyle === 'pinstripe'){
    const stripeColor = palette.secondaryColor || 0xffffff;
    g.fillStyle(stripeColor, 0.55);
    const stripeCount = 4;
    for (let i=0;i<stripeCount;i++){
      const sx = cx-torsoW/2 + (torsoW/(stripeCount+1))*(i+1);
      g.fillRect(sx-0.6, torsoY+2, 1.2, torsoH-4);
    }
  }
  g.fillStyle(0xffffff,0.85);
  g.fillRect(cx-torsoW/2+3, torsoY+3, torsoW-6, 3);

  // hair — every full-cap style shares the same top/width anchors so they line
  // up consistently on the head instead of drifting style to style.
  const capCenterY = headY - headR*0.65;
  const capHalfW = headR*0.85;
  g.fillStyle(hair.color,1);
  if (hair.style==='afro'){ g.fillEllipse(cx, headY-headR*0.24, headR*2.7, headR*2.05); }
  else if (hair.style==='long'){
    g.fillRoundedRect(cx-headR*0.88, headY-headR*1.25, headR*1.76, headR*1.75, headR*0.5);
    g.fillRoundedRect(cx-headR*1.25, headY-headR*0.05, headR*2.5, headR*1.35, headR*0.6);
  }

  g.fillStyle(skin,1);
  g.fillCircle(cx, headY, headR);
  g.fillStyle(hair.color,1);
  if (hair.style==='fade'){
    g.fillEllipse(cx, capCenterY, capHalfW*2, headR*0.95);
    const hairlineY = headY - headR*0.25;
    g.fillRect(cx-capHalfW, capCenterY, capHalfW*2, hairlineY-capCenterY);
  }
  else if (hair.style==='curls'){
    g.fillEllipse(cx, capCenterY, capHalfW*1.85, headR*0.9);
    for(let i=0;i<9;i++){
      const t = i/8;
      const ang = Math.PI + t*Math.PI;
      const bx = cx + Math.cos(ang)*capHalfW*0.95;
      const by = capCenterY + Math.sin(ang)*headR*0.32;
      g.fillCircle(bx, by, headR*0.19);
    }
  }
  else if (hair.style==='mohawk'){ g.fillTriangle(cx-headR*0.36, headY-headR*0.75, cx+headR*0.36, headY-headR*0.75, cx, headY-headR*1.25); }
  else if (hair.style==='flattop'){ g.fillRect(cx-headR*0.95, headY-headR*1.05, headR*1.9, headR*0.75); }

  if (showFace === false && (hair.style === 'long' || hair.style === 'afro')){
    // viewed from behind — no face to frame, so cover the head fully instead
    // of leaving the bare skin gap the underlay technique carves out for a face
    g.fillStyle(hair.color, 1);
    g.fillCircle(cx, headY, headR);
  }

  // face — bigger cartoonish eyes, optional eyebrows, and a choice of mouths;
  // all drawn last so hair (or anything else) can never cover them
  const expr = palette.expression || {};
  if (showFace !== false){
    if (expr.eyebrows === 'angry'){
      g.fillStyle(hair.color, 0.95);
      g.fillTriangle(cx-headR*0.58, headY-headR*0.2, cx-headR*0.15, headY-headR*0.03, cx-headR*0.58, headY-headR*0.05);
      g.fillTriangle(cx+headR*0.58, headY-headR*0.2, cx+headR*0.15, headY-headR*0.03, cx+headR*0.58, headY-headR*0.05);
    } else if (expr.eyebrows === 'raised'){
      g.fillStyle(hair.color, 0.9);
      g.fillRoundedRect(cx-headR*0.52, headY-headR*0.24, headR*0.34, headR*0.09, headR*0.04);
      g.fillRoundedRect(cx+headR*0.18, headY-headR*0.24, headR*0.34, headR*0.09, headR*0.04);
    }

    g.fillStyle(0xffffff,1);
    g.fillEllipse(cx-headR*0.37, headY+headR*0.04, headR*0.42, headR*0.36);
    g.fillEllipse(cx+headR*0.37, headY+headR*0.04, headR*0.42, headR*0.36);
    g.fillStyle(0x1a1a1a,1);
    g.fillCircle(cx-headR*0.33, headY+headR*0.07, headR*0.19);
    g.fillCircle(cx+headR*0.41, headY+headR*0.07, headR*0.19);
    g.fillStyle(0xffffff,0.95);
    g.fillCircle(cx-headR*0.27, headY+headR*0.01, headR*0.07);
    g.fillCircle(cx+headR*0.47, headY+headR*0.01, headR*0.07);

    // blush + nose — small touches so the face reads as a face, not a mask
    g.fillStyle(0xe8836b, 0.28);
    g.fillCircle(cx-headR*0.5, headY+headR*0.22, headR*0.14);
    g.fillCircle(cx+headR*0.5, headY+headR*0.22, headR*0.14);
    g.fillStyle(0x000000, 0.18);
    g.fillCircle(cx-headR*0.03, headY+headR*0.22, headR*0.05);
    g.fillCircle(cx+headR*0.1, headY+headR*0.22, headR*0.05);

    const my = headY+headR*0.42;
    g.fillStyle(0x8a4a3a,0.85);
    if (expr.mouth === 'smile'){
      g.fillRoundedRect(cx-headR*0.26, my-headR*0.02, headR*0.52, headR*0.14, headR*0.07);
      g.fillCircle(cx-headR*0.29, my+headR*0.03, headR*0.06);
      g.fillCircle(cx+headR*0.29, my+headR*0.03, headR*0.06);
    } else if (expr.mouth === 'smirk'){
      g.fillRoundedRect(cx-headR*0.2, my, headR*0.4, headR*0.11, headR*0.05);
      g.fillCircle(cx+headR*0.24, my-headR*0.03, headR*0.06);
    } else if (expr.mouth === 'frown'){
      g.fillRoundedRect(cx-headR*0.22, my+headR*0.06, headR*0.44, headR*0.12, headR*0.06);
      g.fillCircle(cx-headR*0.25, my+headR*0.14, headR*0.055);
      g.fillCircle(cx+headR*0.25, my+headR*0.14, headR*0.055);
    } else {
      g.fillRoundedRect(cx-headR*0.24, my, headR*0.48, headR*0.13, headR*0.06);
    }

    // Glasses — drawn over the face
    if (palette.glasses && palette.glasses !== 'none') {
      const eyeLX = cx - headR*0.37, eyeRX = cx + headR*0.37;
      const eyeY = headY + headR*0.04;
      const lensW = headR*0.56, lensH = headR*0.44;
      const fc = palette.accessoryColor || 0xc8a060;
      if (palette.glasses === 'shades') {
        g.fillStyle(0x111111, 0.94);
        g.fillRoundedRect(cx - headR*0.85, eyeY - lensH*0.65, headR*1.7, lensH*1.1, lensH*0.42);
        g.fillStyle(0xffffff, 0.1);
        g.fillRoundedRect(cx - headR*0.80, eyeY - lensH*0.58, headR*1.6, lensH*0.26, lensH*0.14);
      } else if (palette.glasses === 'clear') {
        g.fillStyle(fc, 0.88);
        g.fillEllipse(eyeLX, eyeY, lensW+2.4, lensH+2.0);
        g.fillEllipse(eyeRX, eyeY, lensW+2.4, lensH+2.0);
        g.fillRect(cx-1.6, eyeY-1.1, 3.2, 2.0);
        g.fillStyle(0xffffff, 0.08);
        g.fillEllipse(eyeLX, eyeY, lensW, lensH);
        g.fillEllipse(eyeRX, eyeY, lensW, lensH);
      } else if (palette.glasses === 'tinted') {
        g.fillStyle(fc, 0.86);
        g.fillEllipse(eyeLX, eyeY, lensW+2.2, lensH+1.8);
        g.fillEllipse(eyeRX, eyeY, lensW+2.2, lensH+1.8);
        g.fillRect(cx-1.5, eyeY-0.9, 3.0, 1.8);
        g.fillStyle(0x1144aa, 0.6);
        g.fillEllipse(eyeLX, eyeY, lensW, lensH);
        g.fillEllipse(eyeRX, eyeY, lensW, lensH);
      } else if (palette.glasses === 'goggles') {
        g.fillStyle(fc, 0.92);
        g.fillEllipse(eyeLX, eyeY, lensW+3.4, lensH+2.8);
        g.fillEllipse(eyeRX, eyeY, lensW+3.4, lensH+2.8);
        g.fillRect(cx-2.6, eyeY-lensH*0.55, 5.2, lensH*1.0);
        g.fillRect(cx-headR*0.95, eyeY-lensH*0.25, headR*0.15, lensH*0.5);
        g.fillRect(cx+headR*0.80, eyeY-lensH*0.25, headR*0.15, lensH*0.5);
        g.fillStyle(0x88ccff, 0.22);
        g.fillEllipse(eyeLX, eyeY, lensW, lensH);
        g.fillEllipse(eyeRX, eyeY, lensW, lensH);
      }
    }
  }

  // accessories — independent of hairstyle, drawn last so they sit on top of
  // everything; wristbands use the actual tracked wrist position for this pose
  if (palette.accessories){
    const ac = palette.accessoryColor || 0xffffff;
    g.fillStyle(ac,1);
    if (palette.accessories.headband){ g.fillRect(cx-headR, headY-headR*0.42, headR*2, headR*0.3); }
    if (palette.accessories.wristbands && lWrist && rWrist){
      [lWrist, rWrist].forEach(w => {
        if (w.ang === 1){ g.fillRoundedRect(w.x-4.5, w.y-2.5, 9, 5, 2); }
        else { g.fillRoundedRect(w.x-2.5, w.y-4, 5, 8, 2); }
      });
    }
    if (palette.accessories.kneepads){
      g.fillRoundedRect(cx-legW-4-leanSpread, legY+4, legW+4, 6, 2);
      g.fillRoundedRect(cx+leanSpread, legY+4, legW+4, 6, 2);
    }
  }
}

function burst(scene, x, y, color, count){
  for (let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const dist = 22 + Math.random()*32;
    const p = scene.add.circle(x, y, 2.5+Math.random()*2, color, 0.9).setDepth(7);
    scene.tweens.add({ targets:p, x:x+Math.cos(ang)*dist, y:y+Math.sin(ang)*dist, alpha:0, scale:0.3, duration:400+Math.random()*180, ease:'Cubic.easeOut', onComplete:()=>p.destroy() });
  }
}

function crowdPulse(scene, hyped){
  if (!scene.crowd) return;
  scene.tweens.add({ targets: scene.crowd, alpha: hyped ? 1 : 0.25, scaleY: hyped ? 1.3 : 0.9, duration: 140, yoyo:true, ease:'Quad.easeOut' });
  if (scene.crowdBack){
    scene.tweens.add({ targets: scene.crowdBack, alpha: hyped ? 0.75 : 0.2, duration: 140, yoyo:true, ease:'Quad.easeOut' });
  }
  if (scene.crowdSideL && scene.crowdSideR){
    scene.tweens.add({ targets: [scene.crowdSideL, scene.crowdSideR], alpha: hyped ? 0.9 : 0.25, scaleX: hyped ? 1.25 : 0.9, duration: 140, yoyo:true, ease:'Quad.easeOut' });
  }
}

// ---------- Level generation ----------
// Each blocked lane gets the move that beats it baked directly onto the blocker —
// the defender's drawn pose (one hand out vs both hands out) is the only tell.
function buildLevel(n){
  const isBoss = n % 5 === 0;
  const seasonNum = Math.floor((n-1)/20);
  const bossSlot = Math.floor(((n-1)%20)/5);
  const regularLevelsSoFar = n - Math.floor(n/5);
  const themeKey = isBoss ? BOSS_SLOT_THEME[bossSlot] : THEME_KEYS[(regularLevelsSoFar-1) % THEME_KEYS.length];
  const bossIdx = isBoss ? seasonNum % THEME_BOSSES[themeKey].length : 0;
  const packedPaint = !isBoss && (n % 3 === 0);
  const speed = 150 + n*9;
  const window = Math.max(90, 150 - n*5); // vertical beat-zone size, shrinks with level

  const avail = unlockedMoves(n);
  const makeBlockers = (lanesArr, allowMove) => lanesArr.map(lane => ({
    lane,
    move: avail[Phaser.Math.Between(0, avail.length-1)],
    willMove: !!allowMove && n>=4 && Phaser.Math.Between(0,99) < Math.min(50, 15+n*3),
    hasMoved: false,
  }));

  const rows = [];
  let y = PLAYER_Y - 240;
  const normalCount = isBoss ? Math.min(4 + Math.floor(n/3), 7) : Math.min(6 + Math.floor(n/2), 13);
  let checkpointY = null;
  const checkpointAfter = Math.floor(normalCount/2); // halfway through the normal rows
  for (let i=0;i<normalCount;i++){
    const openLane = Phaser.Math.Between(0,2);
    let lanes = [0,1,2].filter(l=>l!==openLane);
    if (Phaser.Math.Between(0,2)===0) lanes = [lanes[Phaser.Math.Between(0,1)]]; // sometimes just 1 defender, easier gap
    rows.push({ y, blockers: makeBlockers(lanes, !isBoss), resolved:false });
    y -= Phaser.Math.Between(250,340) - n*4;
    if (i === checkpointAfter-1) checkpointY = y + 70; // mark the line just past this row
  }
  if (checkpointY === null) checkpointY = y + 70;

  const arcY = y - 90;
  let bossY = null;
  if (isBoss){
    bossY = arcY - 170;
    y = bossY - 40;
  } else if (packedPaint){
    rows.push({ y: arcY - 90, blockers: makeBlockers([0,1,2], false), resolved:false, packed:true });
    const openLane2 = Phaser.Math.Between(0,2);
    const secondRowLanes = [0,1,2].filter(l=>l!==openLane2);
    rows.push({ y: arcY - 190, blockers: makeBlockers(secondRowLanes, false), resolved:false, packed:true });
    y = arcY - 190;
  }
  const rimY = y - 160;

  const shotWindow = Math.max(0.14, 0.34 - n*0.015); // fraction of bar width that counts as a make, narrows with level
  const shotPeriod = Math.max(400, 1300 - n*70); // ms — lower = faster-moving marker; starts slow, ramps up

  const usScore = 61 + Math.floor(Math.random()*38);
  return { rows, arcY, rimY, checkpointY, speed, window, packedPaint, isBoss, bossIdx, bossY, themeKey, theme: THEMES[themeKey], shotWindow, shotPeriod, arenaScore: { us: usScore, them: usScore+1 } };
}

      const glowTween = this.tweens.add({ targets: glow, scale:{from:1.2,to:1.7}, alpha:{from:0.55,to:0.95}, duration:480, yoyo:true, repeat:-1 });
      const spr = this.add.sprite(bx, by, bossPrefix+suffix).setOrigin(0.5,0.85).setDepth(2).setScale(1.7);

      const comboText = this.add.text(bx, by-84, comboStr, {fontSize:'15px', fontStyle:'bold', color:'#ffffff', stroke:'#000000', strokeThickness:4}).setOrigin(0.5).setDepth(3).setAlpha(0);
      const moveLabel = this.add.text(bx, by-58, firstMove, {fontSize:'21px', fontStyle:'bold', color:'#'+MOVE_COLOR[firstMove].toString(16).padStart(6,'0'), stroke:'#000000', strokeThickness:4}).setOrigin(0.5).setDepth(3).setAlpha(0);
      const perStep = Math.max(850, 1550 - level*35);
      this.boss = { name: bossDef.name, color: bossDef.color, texPrefix: bossPrefix, combo, comboIndex: 0, y: by, spr, glow, glowTween, shadow, nameText, comboText, moveLabel, resolved:false, stageDuration: perStep, stageStart: 0, timedOut: false, introPause: false, entered: false, hitOffset: 0, promptShown: false };
    }

    this.finished = false;

    const newMove = NEW_MOVE_AT_LEVEL[level];
    if (newMove){
      const hex = '#'+MOVE_COLOR[newMove].toString(16).padStart(6,'0');

      : '';
    titleCard.innerHTML = this.cfg.isBoss
      ? `<h2>${seasonPrefix}${rInfo.name}</h2><span>${THEME_BOSSES[this.cfg.themeKey][this.cfg.bossIdx].name} ${bossFlavor[this.cfg.themeKey]}</span>${unlockHTML}${hooperHTML}`
      : `<h2>${seasonPrefix}${rInfo.name}</h2><span>Level ${level} · ${theme.label}</span>${unlockHTML}${hooperHTML}`;
