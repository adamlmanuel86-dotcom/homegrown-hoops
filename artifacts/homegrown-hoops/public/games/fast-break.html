  drawArc(){
    this.arcLine.clear();
    this.arcLine.lineStyle(3, 0x35d07f, 0.85);
    const cx = W/2, halfW = W/2 - 24;
    const segs = 28;
    const pts = [];
    for (let i=0;i<=segs;i++){
      const t = i/segs;
      const x = cx - halfW + t*halfW*2;
      const nx = (x-cx)/halfW;
      pts.push({ x, y: this.arcY + ARC_BOW*(1 - nx*nx) });
    }
    for (let i=0;i<pts.length-1;i+=2){
      this.arcLine.lineBetween(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
    }
  }

  drawKey(){
    this.keyGfx.clear();
    this.keyGfx.lineStyle(2, 0xffffff, 0.22);
    const top = this.rimY + 14, bottom = this.rimY + 150;
    const left = LANES[0]-18, right = LANES[2]+18;
    this.keyGfx.strokeRect(left, top, right-left, bottom-top);
  }

  drawCheckpoint(){
    this.checkpointLine.clear();
    this.checkpointLine.lineStyle(3, 0xffffff, 0.55);
    this.checkpointLine.lineBetween(14, this.checkpointY, W-14, this.checkpointY);
    this.checkpointLine.lineStyle(1, 0xffffff, 0.3);
    this.checkpointLine.strokeCircle(W/2, this.checkpointY, 26);
  }

  showHooperSelect(){
    document.getElementById('hud').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('hooperSelectUI').style.display = 'block';
    this.cameras.main.setBackgroundColor('#0f1b2d');
    this.add.text(W/2, 56, 'CHOOSE YOUR HOOPER', {fontSize:'22px', fontStyle:'900', color:'#ff7a1a'}).setOrigin(0.5);
    this.add.text(W/2, 86, 'Pick a baller to run with', {fontSize:'12px', color:'#c9d3e0'}).setOrigin(0.5);
    this.hooperOptions = [randomHooper(), randomHooper(), randomHooper()];
    this.hooperSprites = [];
    this.renderHooperOptions();
  }

  renderHooperOptions(){
    if (this.hooperSprites.length) this.hooperSprites.forEach(o => o.destroy());
    this.hooperSprites = [];
    const g = this.add.graphics().setVisible(false);
    const colW = W/3;
    this.hooperOptions.forEach((h, i) => {
      const x = colW*i + colW/2;
      const y = 250;
      const key = 'hoopersel_'+i;
      g.clear();
      drawBaller(g, h.palette, undefined, undefined, undefined, true);
      if (this.textures.exists(key)) this.textures.remove(key);
      g.generateTexture(key, 44, 64);
      const spr = this.add.sprite(x, y, key).setScale(2.6);
      const nameText = this.add.text(x, y+96, h.name, {fontSize:'15px', fontStyle:'900', color:'#ffffff', stroke:'#000000', strokeThickness:4, align:'center', wordWrap:{width:colW-16}}).setOrigin(0.5);
      this.hooperSprites.push(spr, nameText);
    });
    g.destroy();
  }

  pickHooper(i){
    selectedHooperPalette = this.hooperOptions[i].palette;
    selectedHooperName = this.hooperOptions[i].name;
    document.getElementById('hooperSelectUI').style.display = 'none';
    this.scene.restart();
  }

  update(time, delta){
    if (!selectedHooperPalette) return;
    if (this.finished) return;

    if (this.shotMeterActive){
      // frozen gather pose while the shot power meter runs — world holds still
      this.player.y = this.baseY - 10;
      const elapsed = time - this.shotMeterStart;
      const value = (Math.sin(elapsed / this.cfg.shotPeriod * Math.PI*2 - Math.PI/2) + 1) / 2;
      this.shotMeterValue = value;
      document.getElementById('shotMeterMark').style.left = (value*100) + '%';
      return;
    }

    const dy = (this.introActive || this.perfectPause || this.bossActive) ? 0 : (this.cfg.speed * delta)/1000;

    // run-cycle: alternate leg frame + bob so the avatar visibly moves
    this.runTimer += delta;
    if (this.runTimer > 110){
      this.runTimer = 0;
      this.runFrame = this.runFrame===0 ? 1 : 0;
      this.player.setTexture('player_run'+this.runFrame);
    }
    this.player.y = this.baseY - Math.abs(Math.sin(time/110))*4;
    this.playerShadow.x = this.player.x;
    this.playerNumber.x = this.player.x;
    this.playerNumber.y = this.player.y - 32;
    const bob = this.baseY - this.player.y;
    this.playerShadow.setScale(1 - Math.min(bob/32, 0.35));
    this.playerShadow.setAlpha(0.32 - Math.min(bob/90, 0.14));

    // dribble: ball bounces near whichever hand is trailing, opposite phase to the leg bob
    const dribble = Math.abs(Math.sin(time/95));
    const handSide = this.runFrame === 0 ? 1 : -1;
    this.ball.x = this.player.x + handSide*13;
    this.ball.y = this.baseY - 6 - dribble*16;

    this.rowObjs.forEach(r => {
      r.y += dy;
      r.sprites.forEach((s,i) => {
        s.spr.y += dy; s.glow.y += dy; s.shadow.y += dy;
        const b = r.blockers[i];
        if (b.willMove && !b.hasMoved){
          const dist = r.y - PLAYER_Y;
          if (dist > -260){
            b.hasMoved = true;
            const dir = Phaser.Math.Between(0,1) ? 1 : -1;
            let newLane = Phaser.Math.Clamp(b.lane + dir, 0, 2);
            if (newLane === b.lane) newLane = Phaser.Math.Clamp(b.lane - dir, 0, 2);
            const occupied = r.blockers.some((ob,oi) => oi!==i && ob.lane === newLane);
            if (!occupied && newLane !== b.lane){
              b.lane = newLane;
              const newX = LANES[newLane] + Phaser.Math.Between(-12,12);
              this.tweens.add({ targets:[s.spr, s.glow, s.shadow], x: newX, duration: 420, ease:'Sine.easeInOut' });
            }
          }
        }
      });
    });
    this.arcY += dy; this.drawArc(); this.arcText.y += dy;
    if (!this.checkpointCleared){
      this.checkpointY += dy;
      this.drawCheckpoint();
      this.checkpointText.y += dy;
      if ((this.checkpointY - PLAYER_Y) > -20){
        this.checkpointCleared = true;
        checkpointReached = true;
        this.checkpointLine.setVisible(false);
        this.checkpointText.setVisible(false);
        showBanner('CHECKPOINT!', '#ffffff');
        this.cameras.main.flash(180, 255, 255, 255, false);
      }
    }
    this.rimY += dy; this.rim.y += dy; this.rimText.y += dy; this.backdropDetail.y += dy;
    if (this.scoreboardText) this.scoreboardText.y += dy;
    this.drawKey();

    if (this.boss && !this.boss.resolved){
      this.boss.y += dy;
      this.boss.spr.y += dy; this.boss.glow.y += dy; this.boss.shadow.y += dy;
      this.boss.nameText.y += dy; this.boss.comboText.y += dy; this.boss.moveLabel.y += dy;
      if (!this.bossActive && (this.boss.y - PLAYER_Y) > -170){
        this.bossActive = true;
        // entrance flourish — this should feel like a different kind of encounter, not a bigger defender
        this.boss.spr.setScale(0.15);
        this.tweens.add({ targets: this.boss.spr, scale: 1.7, duration: 320, ease: 'Bounce.easeOut' });
        this.time.delayedCall(280, () => burst(this, this.boss.spr.x, this.boss.spr.y+8, this.boss.color, 22));
        this.cameras.main.shake(220, 0.014);
        this.cameras.main.zoomTo(1.48, 400, 'Sine.easeOut');
        this.time.delayedCall(420, () => this.cameras.main.zoomTo(1.25, 300, 'Sine.easeIn'));
        sfxBossRoar();
        showBanner(`${this.boss.name} APPEARS!`, '#ffffff');
        // dramatic name reveal — its own beat, staggered after the entrance bounce
        this.time.delayedCall(300, () => {
          this.tweens.add({ targets: this.boss.nameText, alpha:1, scale:1, duration: 450, ease: 'Back.easeOut' });
          this.cameras.main.flash(200, 255, 255, 255, false);
        });
        this.time.delayedCall(850, () => {
          this.tweens.add({ targets: [this.boss.comboText, this.boss.moveLabel], alpha:1, duration: 350, ease: 'Sine.easeOut' });
        });
        document.getElementById('bossHP').style.display = 'block';
        document.getElementById('bossHPLabel').textContent = this.boss.name;
        document.getElementById('bossHPFill').style.background = '#'+this.boss.color.toString(16).padStart(6,'0');
        document.getElementById('bossHPFill').style.width = '100%';
        startBossStage(this, 1500);
      }
      if (this.bossActive){
        // idle menace — a heavier, slower bob than a normal defender ever gets
        this.boss.spr.y = this.boss.y + Math.sin(time/240)*5 + (this.boss.hitOffset||0);
      }
    }

    // expire stale buffered input
    if (queuedMove && Date.now() - queuedMove.ts > INPUT_BUFFER_MS) queuedMove = null;

    // 3PT window — biased earlier (opens well before the line) so it's not a last-second surprise
    const arcDist = this.arcY - PLAYER_Y;
    this.arcActive = !this.shotTaken && !this.bossActive && arcDist > -190 && arcDist < 40;
    document.getElementById('prompt').textContent = this.cfg.packedPaint ? 'PAINT PACKED — PULL UP FOR 3?' : 'PULL UP FOR 3?';
    document.getElementById('prompt').style.opacity = this.arcActive ? 1 : 0;
    const laneNx = (this.player.x - W/2) / (W/2 - 24);
    const arcAtLaneDist = (this.arcY + ARC_BOW*(1-laneNx*laneNx)) - PLAYER_Y;
    setControlMode(this.arcActive, arcAtLaneDist > 0);
    document.getElementById('moveGroup').style.visibility = this.bossActive ? 'hidden' : 'visible';

    // clutch mode: a temporary forgiveness window earned by a hot streak
    const inClutch = time < (this.clutchUntil||0);
    setClutchVisual(inClutch);
    const effWindow = this.cfg.window * (inClutch ? 1.35 : 1);

    // boss fight: world is frozen (bossActive). Input comes from tapping the
    // randomly-placed prompt circle directly, not the corner move buttons —
    // introPause is a brief reveal beat before the first prompt appears.
    if (this.bossActive && this.boss && !this.boss.resolved && !this.boss.introPause && this.boss.promptShown){
      const elapsed = time - this.boss.stageStart;
      const remaining = Math.max(0, 1 - elapsed/this.boss.stageDuration);
      updateBossPromptRing(remaining, MOVE_COLOR[this.boss.combo[this.boss.comboIndex]]);
      if (remaining <= 0 && !this.boss.timedOut){
        this.boss.timedOut = true;
        bossTimeout(this);
      }
    }

    // resolve defender rows
    let consumed = false;
    this.rowObjs.forEach(r => {
      if (r.resolved) return;
      const dist = r.y - PLAYER_Y;
      const blocker = r.blockers.find(b => b.lane === this.currentLane);
      const inZone = Math.abs(dist) < effWindow/2;
      const perfect = Math.abs(dist) < effWindow*0.18;

      if (blocker && queuedMove && inZone && !consumed){
        const usedMove = queuedMove.move;
        if (usedMove === blocker.move){
          beatRow(this, r, usedMove, perfect);
        } else {
          getStripped(this, r); // wrong counter — still gets you stripped
        }
        queuedMove = null;
        consumed = true;
      } else if (dist > effWindow/2 + 10){
        // row has passed the player
        if (blocker) getStripped(this, r); else passRow(this, r);
      }
    });

    if (!this.finished && this.rimY - PLAYER_Y > -30){
      finishDunk(this);
    }
  }

  startShot(){
    if (!this.arcActive || this.shotTaken || this.shotMeterActive || this.finished) return;
    this.shotMeterActive = true;
    this.shotMeterStart = this.time.now;
    document.getElementById('prompt').style.opacity = 0;
    document.getElementById('shotMeter').style.display = 'block';
  }

  releaseShot(){
    if (!this.shotMeterActive) return;
    this.shotMeterActive = false;
    this.shotTaken = true;
    document.getElementById('shotMeter').style.display = 'none';
    const value = this.shotMeterValue === undefined ? 0 : this.shotMeterValue;
    const made = Math.abs(value - 0.5) <= this.cfg.shotWindow/2;

    // use the curved arc's actual height under the player's current lane —
    // the line bows toward the player at center court, so the flat arcY
    // reference alone under-counted how far past the line center-lane players were
    const cx = W/2, halfW = W/2 - 24;
    const nx = (this.player.x - cx) / halfW;
    const arcYAtLane = this.arcY + ARC_BOW*(1 - nx*nx);
    const pastLine = (arcYAtLane - PLAYER_Y) > 0;

    stats.fga++;
    if (!pastLine) stats.tpa++;

    if (made){
      stats.fgm++;
      if (pastLine){ stats.points += 2; finishMidrange(this); }
      else { stats.tpm++; stats.points += 3; finishThree(this); }
    } else {
      flashPlayer(this, 0xff9955);
      this.cameras.main.shake(90, 0.005);
      sfxClank();
      sfxCrowdGroan();
      crowdPulse(this, false);
      showBanner('CLANK!', '#ff9955');
    }
  }

  shiftLane(dir){
    const next = Phaser.Math.Clamp(this.currentLane + dir, 0, 2);
    if (next === this.currentLane) return;
    this.currentLane = next;
    sfxShift();
    this.tweens.add({ targets: this.player, x: LANES[next], duration: 130, ease:'Quad.easeOut' });
  }
}

function passRow(scene, r){
  r.resolved = true;
  dodgeStreak += 1;
  updateDodgeUI(dodgeStreak);
  addScore(3);
  if (dodgeStreak > 0 && dodgeStreak % 10 === 0){
    addScore(20);
    const label = dodgeStreak >= 30 ? 'UNGUARDABLE!' : dodgeStreak >= 20 ? 'BLOWING BY!' : 'BLOW BY!';
    showBanner(label, '#35d0e8');
    sfxCrowdCheer(false);
    crowdPulse(scene, true);
  }
}

function updateDodgeUI(n){
  const pill = document.getElementById('dodgePill');
  if (n >= 3){
    pill.style.display = 'inline-block';
    document.getElementById('dodgeVal').textContent = n;
  } else {
    pill.style.display = 'none';
  }
}

function registerStreak(scene){
  streak += 1;
  if (streak > sessionBestStreak) sessionBestStreak = streak;
  updateStreakUI(streak);
  updateHypeUI(streak);
  if (streak % 5 === 0) triggerClutch(scene);
  if (streak >= nextSuperThreshold && !superReady){
    superReady = true;
    nextSuperThreshold += 8;
    document.getElementById('comboBtn').style.display = 'flex';
    showBanner('COMBO READY!', '#ffd23f');
  }
}

function useSuperMove(scene){
  if (!superReady || !scene || scene.finished) return;
  superReady = false;
  document.getElementById('comboBtn').style.display = 'none';
  showBanner('COMBO!!', '#ffd23f');
  scene.cameras.main.flash(200, 255, 210, 60, false);
  scene.cameras.main.shake(140, 0.008);
  sfxAnkles();

  if (scene.bossActive && scene.boss && !scene.boss.resolved){
    const remaining = scene.boss.combo.length - scene.boss.comboIndex;
    const toLand = Math.min(3, remaining);
    for (let i=0;i<toLand;i++){
      scene.time.delayedCall(i*200, () => { if (scene.boss && !scene.boss.resolved) bossHit(scene); });
    }
  } else {
    const targets = scene.rowObjs.filter(r => !r.resolved).sort((a,b) => b.y - a.y).slice(0,3);
    targets.forEach((r,i) => {
      scene.time.delayedCall(i*150, () => {
        if (r.resolved) return;
        r.resolved = true;
        r.sprites.forEach(s => { if (s.glowTween) s.glowTween.stop(); });
        const tw = r.sprites.flatMap(s => [s.spr, s.glow, s.shadow]);
        scene.tweens.add({ targets: tw, alpha:0, angle:120, duration:260, ease:'Cubic.easeIn' });
        spawnGhost(scene, scene.player, 0xffd23f);
        scene.cameras.main.shake(60, 0.006);
        addScore(20);
        const dir = Phaser.Math.Between(0,1) ? 1 : -1;
        scene.tweens.add({ targets: scene.player, x: scene.player.x + dir*16, duration: 80, yoyo:true });
      });
    });
  }
}

function beatRow(scene, r, move, perfect){
  r.resolved = true;
  r.sprites.forEach(s => s.glowTween.stop());
  const spriteTargets = r.sprites.map(s => s.spr);
  const glowShadowTargets = r.sprites.flatMap(s => [s.glow, s.shadow]);
  flashPlayer(scene, 0x35d07f);
  registerStreak(scene);
  addScore(perfect ? 25 : 10);

  if (perfect && move === MOVES.CROSSOVER){
    // ANKLES BROKEN — defender goes down. World pauses briefly so this actually reads.
    scene.perfectPause = true;
    scene.time.delayedCall(650, () => { scene.perfectPause = false; });
    scene.tweens.add({ targets: spriteTargets, angle: 85, y: '+=16', alpha: 0, duration: 560, ease: 'Back.easeIn' });
    scene.tweens.add({ targets: glowShadowTargets, alpha: 0, duration: 400 });
    sfxAnkles();
    scene.cameras.main.zoomTo(1.23, 140, 'Sine.easeOut');
    scene.time.delayedCall(600, () => scene.cameras.main.zoomTo(1.12, 200, 'Sine.easeIn'));
    scene.cameras.main.shake(90, 0.005);
    spawnGhost(scene, scene.player, 0xff7a1a);
    const dir = Phaser.Math.Between(0,1) ? 1 : -1;
    scene.tweens.add({ targets: scene.player, x: scene.player.x + dir*22, scaleX: 0.8, duration: 90, yoyo:true, ease:'Quad.easeOut' });
    showBanner('ANKLES BROKEN!', '#ff3b3b');
    sfxCrowdCheer(false);
    crowdPulse(scene, true);
    return;
  }
  if (perfect && move === MOVES.SPIN){
    // SPIN CYCLE — defender spins out of the way. World pauses briefly so this actually reads.
    scene.perfectPause = true;
    scene.time.delayedCall(650, () => { scene.perfectPause = false; });
    const dir = Phaser.Math.Between(0,1) ? 1 : -1;
    spriteTargets.forEach(spr => {
      scene.tweens.add({ targets: spr, x: spr.x + dir*44, angle: 360*dir, alpha: 0, duration: 560, ease:'Cubic.easeIn' });
    });
    scene.tweens.add({ targets: glowShadowTargets, alpha: 0, duration: 400 });
    sfxAnkles();
    scene.cameras.main.zoomTo(1.23, 140, 'Sine.easeOut');
    scene.time.delayedCall(600, () => scene.cameras.main.zoomTo(1.12, 200, 'Sine.easeIn'));
    spawnGhost(scene, scene.player, 0x2f6fed);
    scene.time.delayedCall(60, () => spawnGhost(scene, scene.player, 0x2f6fed));
    scene.player.angle = 0;
    scene.tweens.add({ targets: scene.player, angle: 360, duration: 300, ease:'Cubic.easeInOut', onComplete: () => { scene.player.angle = 0; } });
    showBanner('SPIN CYCLE!', '#2f6fed');
    sfxCrowdCheer(false);
    crowdPulse(scene, true);
    return;
  }

  if (perfect && move === MOVES.HESI){
    // FROZE 'EM! — defender freezes rigid, then topples straight backward.
    scene.perfectPause = true;
    scene.time.delayedCall(650, () => { scene.perfectPause = false; });
    spriteTargets.forEach(spr => spr.setTint(0x9be8ff));
    scene.tweens.add({ targets: spriteTargets, angle: -100, y: '+=20', alpha: 0, duration: 560, ease: 'Back.easeIn' });
    scene.tweens.add({ targets: glowShadowTargets, alpha: 0, duration: 400 });
    sfxFreeze();
    scene.cameras.main.zoomTo(1.23, 140, 'Sine.easeOut');
    scene.time.delayedCall(600, () => scene.cameras.main.zoomTo(1.12, 200, 'Sine.easeIn'));
    spawnGhost(scene, scene.player, MOVE_COLOR.HESI);
    scene.tweens.add({ targets: scene.player, scaleY: 0.8, scaleX: 1.15, duration: 110, yoyo:true, ease:'Quad.easeOut' });
    showBanner("FROZE 'EM!", '#9be8ff');
    sfxCrowdCheer(false);
    crowdPulse(scene, true);
    return;
  }

  if (perfect && move === MOVES.BEHINDBACK){
    // NASTY! — swirling colors sweep around the player instead of a full spin,
    // keeping this visually distinct from Spin Cycle's rotation
    scene.perfectPause = true;
    scene.time.delayedCall(650, () => { scene.perfectPause = false; });
    scene.tweens.add({ targets: spriteTargets, x: '+=18', alpha: 0, duration: 560, ease: 'Cubic.easeIn' });
    scene.tweens.add({ targets: glowShadowTargets, alpha: 0, duration: 420 });
    sfxBehindBack();
    scene.cameras.main.zoomTo(1.23, 140, 'Sine.easeOut');
    scene.time.delayedCall(600, () => scene.cameras.main.zoomTo(1.12, 200, 'Sine.easeIn'));
    const swirlColors = [MOVE_COLOR.BEHINDBACK, 0xffffff, MOVE_COLOR.BEHINDBACK, 0xffd23f];
    for (let i=0;i<9;i++){
      scene.time.delayedCall(i*32, () => {
        const ang = (i/9)*Math.PI*2;
        const px = scene.player.x + Math.cos(ang)*18;
        const py = scene.player.y - 14 + Math.sin(ang)*12;
        const dot = scene.add.circle(px, py, 3, swirlColors[i%swirlColors.length], 0.9).setDepth(6);
        scene.tweens.add({
          targets: dot,
          x: scene.player.x + Math.cos(ang+Math.PI*1.4)*26,
          y: scene.player.y - 14 + Math.sin(ang+Math.PI*1.4)*16,
          alpha: 0, scale: 0.3, duration: 480, ease: 'Sine.easeOut',
          onComplete: () => dot.destroy()
        });
      });
    }
    spawnGhost(scene, scene.player, MOVE_COLOR.BEHINDBACK);
    scene.tweens.add({ targets: scene.player, scaleX: 1.12, scaleY: 0.85, duration: 130, yoyo:true, ease:'Quad.easeOut' });
    showBanner('NASTY!', '#2ecc71');
    sfxCrowdCheer(false);
    crowdPulse(scene, true);
    return;
  }

  if (perfect && move === MOVES.INANDOUT){
    // GOT HIM LEANING! — defender commits hard to the fake and skates off balance.
    scene.perfectPause = true;
    scene.time.delayedCall(650, () => { scene.perfectPause = false; });
    const dir = Phaser.Math.Between(0,1) ? 1 : -1;
    spriteTargets.forEach(spr => {
      scene.tweens.add({ targets: spr, x: spr.x + dir*60, angle: dir*40, alpha: 0, duration: 600, ease:'Sine.easeIn' });
    });
    scene.tweens.add({ targets: glowShadowTargets, alpha: 0, duration: 420 });
    sfxInAndOut();
    scene.cameras.main.zoomTo(1.23, 140, 'Sine.easeOut');
    scene.time.delayedCall(600, () => scene.cameras.main.zoomTo(1.12, 200, 'Sine.easeIn'));
    spawnGhost(scene, scene.player, MOVE_COLOR.INANDOUT);
    scene.tweens.add({ targets: scene.player, scaleX: 1.15, scaleY: 0.85, duration: 100, yoyo:true, ease:'Quad.easeOut' });
    showBanner('GOT HIM LEANING!', '#9b59b6');
    sfxCrowdCheer(false);
    crowdPulse(scene, true);
    return;
  }

  const targets = spriteTargets.concat(glowShadowTargets);
  scene.tweens.add({ targets, alpha:0.15, duration:200 });
  if (move === MOVES.SPIN){
    sfxSpin();
    spawnGhost(scene, scene.player, 0x2f6fed);
    scene.time.delayedCall(60, () => spawnGhost(scene, scene.player, 0x2f6fed));
    scene.player.angle = 0;
    scene.tweens.add({ targets: scene.player, angle: 360, duration: 300, ease:'Cubic.easeInOut', onComplete: () => { scene.player.angle = 0; } });
  } else if (move === MOVES.HESI){
    sfxHesi();
    spawnGhost(scene, scene.player, MOVE_COLOR.HESI);
    scene.tweens.add({ targets: scene.player, scaleY: 0.82, scaleX: 1.12, duration: 90, yoyo:true, ease:'Quad.easeOut' });
  } else if (move === MOVES.BEHINDBACK){
    sfxBehindBack();
    spawnGhost(scene, scene.player, MOVE_COLOR.BEHINDBACK);
    scene.tweens.add({ targets: scene.player, angle: -180, duration: 200, ease:'Sine.easeInOut', onComplete: () => { scene.player.angle = 0; } });
  } else if (move === MOVES.INANDOUT){
    sfxInAndOut();
    spawnGhost(scene, scene.player, MOVE_COLOR.INANDOUT);
    const dir = Phaser.Math.Between(0,1) ? 1 : -1;
    scene.tweens.add({ targets: scene.player, x: scene.player.x + dir*12, duration: 70, yoyo:true, repeat:1, ease:'Quad.easeInOut' });
  } else {
    sfxCrossover();
    spawnGhost(scene, scene.player, 0xff7a1a);
    const dir = Phaser.Math.Between(0,1) ? 1 : -1;
    scene.tweens.add({ targets: scene.player, x: scene.player.x + dir*22, scaleX: 0.8, duration: 90, yoyo:true, ease:'Quad.easeOut' });
  }
  const moveLabels = { CROSSOVER:'CROSSOVER!', SPIN:'SPIN MOVE!', HESI:'HESI MOVE!', BEHINDBACK:'BEHIND THE BACK!', INANDOUT:'IN AND OUT!' };
  const label = streak>=5 ? 'UNSTOPPABLE!' : streak>=3 ? 'ON FIRE!' : moveLabels[move];
  const color = streak>=5 ? '#ff3b3b' : streak>=3 ? '#ffd23f' : '#35d07f';
  showBanner(label, color);
}

function bossHit(scene){
  const boss = scene.boss;
  boss.comboIndex++;
  flashPlayer(scene, 0x35d07f);
  spawnGhost(scene, scene.player, boss.color);
  registerStreak(scene);
  addScore(30);
  boss.spr.setTint(0xffffff);
  scene.time.delayedCall(90, () => boss.spr.clearTint());
  scene.tweens.add({ targets: boss.spr, scaleX: 1.85, scaleY: 1.45, duration: 90, yoyo:true, ease:'Quad.easeOut' });
  boss.hitOffset = -10;
  scene.tweens.add({ targets: boss, hitOffset: 0, duration: 140, ease:'Quad.easeOut' });
  sfxBossHit();
  scene.cameras.main.shake(90 + boss.comboIndex*25, 0.006 + boss.comboIndex*0.002);

  const hpPct = Math.max(0, 100 - (boss.comboIndex/boss.combo.length)*100);
  document.getElementById('bossHPFill').style.width = hpPct + '%';

  if (boss.comboIndex >= boss.combo.length){
    defeatBoss(scene);
  } else {
    const nextMove = boss.combo[boss.comboIndex];
    const suffix = moveSuffix(nextMove);
    boss.spr.setTexture(boss.texPrefix+suffix);
    boss.glow.setTint(MOVE_COLOR[nextMove]);
    boss.moveLabel.setText(nextMove).setColor('#'+MOVE_COLOR[nextMove].toString(16).padStart(6,'0'));
    showBanner(`${boss.name} STAGGERED!`, '#ffffff');
    spawnBossPrompt(scene);
  }
}

// ---------- Boss prompt: a randomly-placed circle you tap directly, distinct from the corner move buttons ----------
function randomPromptSpot(){
  const el = document.getElementById('bossPrompt');
  const size = 84;
  const top = 130 + Math.random() * (window.innerHeight - 260);
  const left = 16 + Math.random() * (window.innerWidth - size - 32);
  el.style.top = top + 'px';
  el.style.left = left + 'px';
}

function spawnBossPrompt(scene){
  const boss = scene.boss;
  const move = boss.combo[boss.comboIndex];
  const el = document.getElementById('bossPrompt');
  document.getElementById('bossPromptInner').textContent = move;
  document.getElementById('bossPromptInner').style.background = '#'+MOVE_COLOR[move].toString(16).padStart(6,'0');
  randomPromptSpot();
  el.style.display = 'block';
  boss.promptShown = true;
  boss.stageStart = scene.time.now;
  boss.timedOut = false;
  updateBossPromptRing(1, MOVE_COLOR[move]);
}

function hideBossPrompt(scene){
  document.getElementById('bossPrompt').style.display = 'none';
  if (scene.boss) scene.boss.promptShown = false;
}

function updateBossPromptRing(remaining, color){
  const ring = document.getElementById('bossPromptRing');
  const hex = '#'+color.toString(16).padStart(6,'0');
  ring.style.background = `conic-gradient(${hex} ${remaining*100}%, rgba(255,255,255,0.18) 0)`;
}

function hitBossPrompt(){
  if (!sceneRef || !sceneRef.bossActive || !sceneRef.boss || sceneRef.boss.resolved || sceneRef.boss.introPause || !sceneRef.boss.promptShown) return;
  hideBossPrompt(sceneRef);
  bossHit(sceneRef);
}

function startBossStage(scene, pauseMs){
  const boss = scene.boss;
  boss.introPause = true;
  hideBossPrompt(scene);
  scene.time.delayedCall(pauseMs || 750, () => {
    if (boss.resolved) return;
    boss.introPause = false;
    spawnBossPrompt(scene);
  });
}

function resetBossCombo(scene){
  const boss = scene.boss;
  boss.comboIndex = 0;
  const move = boss.combo[0];
  const suffix = moveSuffix(move);
  boss.spr.setTexture(boss.texPrefix+suffix);
  boss.glow.setTint(MOVE_COLOR[move]);
  boss.moveLabel.setText(move).setColor('#'+MOVE_COLOR[move].toString(16).padStart(6,'0'));
  document.getElementById('bossHPFill').style.width = '100%';
  startBossStage(scene);
}

function bossTimeout(scene){
  flashPlayer(scene, 0xff3b3b);
  scene.cameras.main.shake(120, 0.01);
  sfxStrip();
  sfxCrowdGroan();
  crowdPulse(scene, false);
  streak = 0;
  dodgeStreak = 0;
  updateDodgeUI(0);
  scene.clutchUntil = 0;
  updateStreakUI(0);
  updateHypeUI(0);
  showBanner('TOO SLOW!', '#ff3b3b');
  hideBossPrompt(scene);
  if (scene.boss) resetBossCombo(scene);
  loseLife(scene);
}

function defeatBoss(scene){
  const b = scene.boss;
  b.resolved = true;
  hideBossPrompt(scene);
  document.getElementById('bossHP').style.display = 'none';
  showBanner('FINISHING MOVE!', '#ffffff');
  scene.cameras.main.zoomTo(1.43, 200, 'Sine.easeOut');
  scene.time.delayedCall(220, () => {
    scene.tweens.add({ targets:[b.spr,b.glow,b.shadow,b.nameText,b.comboText,b.moveLabel], scale:0, alpha:0, angle:180, duration:450, ease:'Back.easeIn' });
    burst(scene, b.spr.x, b.spr.y, b.color, 36);
    scene.cameras.main.shake(240, 0.014);
    sfxScore();
    sfxCrowdCheer(true);
    crowdPulse(scene, true);
    addScore(150);
    showBanner(`${b.name} DEFEATED!`, '#ffd23f');
    scene.time.delayedCall(550, () => {
      scene.cameras.main.zoomTo(1.12, 300, 'Sine.easeIn');
      scene.bossActive = false; // resume the drive to the rim
    });
  });
}

function getStripped(scene, r){
  if (r.resolved || scene.invuln) return;
  r.resolved = true;
  r.sprites.forEach(s => s.glowTween.stop());
  const targets = r.sprites.flatMap(s => [s.spr, s.glow, s.shadow]);
  scene.tweens.add({ targets, alpha:0, duration:150 });
  flashPlayer(scene, 0xff3b3b);
  scene.cameras.main.shake(120, 0.01);
  sfxStrip();
  sfxCrowdGroan();
  crowdPulse(scene, false);
  streak = 0;
  dodgeStreak = 0;
  updateDodgeUI(0);
  scene.clutchUntil = 0;
  updateStreakUI(0);
  updateHypeUI(0);
  showBanner('LOCKED UP!', '#ff3b3b');
  loseLife(scene);
}

function updateStreakUI(n){
  const pill = document.getElementById('streakPill');
  if (n >= 2){
    pill.style.display = 'inline-block';
    document.getElementById('streakVal').textContent = n;
    pill.style.borderColor = n>=5 ? '#ff3b3b' : n>=3 ? '#ffd23f' : '#35d07f';
  } else {
    pill.style.display = 'none';
  }
}

function updateHypeUI(n){
  const lap = n % 5;
  const pct = (lap === 0 && n > 0) ? 100 : lap*20;
  document.getElementById('hypeFill').style.width = pct + '%';
}

function triggerClutch(scene){
  scene.clutchUntil = scene.time.now + 4000;
  showBanner('CLUTCH MODE!', '#ffd23f');
  scene.cameras.main.flash(150, 255, 210, 60, false);
  sfxCrowdCheer(false);
  crowdPulse(scene, true);
}

function setClutchVisual(active){
  document.getElementById('hypeBar').classList.toggle('clutch', active);
}

function spawnGhost(scene, sprite, tint){
  const ghost = scene.add.sprite(sprite.x, sprite.y, sprite.texture.key).setOrigin(sprite.originX, sprite.originY).setAlpha(0.5).setTint(tint);
  scene.tweens.add({ targets: ghost, alpha:0, duration:250, onComplete:()=>ghost.destroy() });
}

function flashPlayer(scene, color){
  scene.player.setTint(color);
  scene.invuln = true;
  scene.time.delayedCall(260, () => { scene.player.clearTint(); scene.invuln=false; });
}

function showBanner(text,color){
  const el = document.getElementById('banner');
  el.textContent = text; el.style.color = color; el.style.opacity=1;
  clearTimeout(window.__bt);
  window.__bt = setTimeout(()=>{ el.style.opacity=0; }, 500);
}

function loseLife(scene){
  lives -= 1;
  renderLives();
  if (lives <= 0){
    scene.finished = true;
    totalTurnovers += 1;
    if (totalTurnovers >= BENCH_THRESHOLD){
      openOverlay('BENCHED!', `${totalTurnovers} turnovers and the coach has seen enough. Final score: ${score}`, 'New Game', () => {
        fullReset();
        restartLevel(scene);
      });
    } else {
      openOverlay('TURNOVER', `You got locked up too many times. (${totalTurnovers}/${BENCH_THRESHOLD} turnovers before you're benched)`, 'Retry Level', () => { lives = 3; restartLevel(scene); });
    }
  }
}

function fullReset(){
  level = 1; lives = 3; streak = 0; score = 0; dodgeStreak = 0;
  sessionBestStreak = 0; totalTurnovers = 0;
  stats = { fgm:0, fga:0, tpm:0, tpa:0, dunks:0, points:0 };
  superReady = false; nextSuperThreshold = 8;
  cachedCfg = null; cachedCfgLevel = null; checkpointReached = false;
  document.getElementById('comboBtn').style.display = 'none';
  document.getElementById('scoreVal').textContent = '0';
}

function shootBallToRim(scene, opts){
  scene.finished = true;
  scene.tweens.add({ targets: scene.player, y: scene.baseY-30, duration:180, yoyo:true, ease:'Quad.easeOut' });
  scene.cameras.main.zoomTo(1.25, 220, 'Sine.easeOut');

  const startX = scene.ball.x, startY = scene.ball.y;
  const endX = scene.rim.x, endY = scene.rim.y - 6;
  const dist = Phaser.Math.Distance.Between(startX, startY, endX, endY);
  const arcHeight = Phaser.Math.Clamp(dist*0.35, 60, 170);
  const flightDuration = Phaser.Math.Clamp(dist*1.05, 380, 750);

  const shot = { t: 0 };
  scene.tweens.add({
    targets: shot,
    t: 1,
    duration: flightDuration,
    ease: 'Sine.easeIn',
    onUpdate: () => {
      const t = shot.t;
      scene.ball.x = startX + (endX-startX)*t;
      scene.ball.y = startY + (endY-startY)*t - Math.sin(t*Math.PI)*arcHeight;
      scene.ball.angle += 16;
    },
    onComplete: () => {
      burst(scene, endX, endY, opts.particleColor, 12);
      sfxScore();
      sfxCrowdCheer(true);
      crowdPulse(scene, true);
      showBanner(opts.banner, opts.bannerColor);
      scene.time.delayedCall(450, () => {
        scene.cameras.main.zoomTo(1.12, 300, 'Sine.easeIn');
        openOverlay(opts.overlayTitle, opts.overlaySub, 'Next Level', () => {
          level += 1; lives = 3; restartLevel(scene);
        });
      });
    }
  });
}

function finishThree(scene){
  addScore(50);
  shootBallToRim(scene, {
    particleColor: 0x35d07f,
    banner: 'SPLASH! +3',
    bannerColor: '#35d07f',
    overlayTitle: 'SPLASH!',
    overlaySub: `Pulled up from three — level ${level} complete.`,
  });
}

function finishMidrange(scene){
  addScore(30);
  shootBallToRim(scene, {
    particleColor: 0xff7a1a,
    banner: 'MIDDY MAGIC! +2',
    bannerColor: '#ff7a1a',
    overlayTitle: 'MIDDY MAGIC!',
    overlaySub: `Pulled up from mid-range after crossing the line — level ${level} complete.`,
  });
}

function finishDunk(scene){
  scene.finished = true;
  stats.fgm++; stats.fga++; stats.dunks++; stats.points += 2;
  addScore(40);
  const centerX = scene.rim.x;
  scene.tweens.add({ targets: [scene.player, scene.playerNumber, scene.ball, scene.playerShadow], x: centerX, duration: 150, ease:'Quad.easeOut' });
  scene.tweens.add({ targets: scene.player, y: scene.baseY-46, duration:220, delay:60, yoyo:true, ease:'Quad.easeOut' });
  scene.tweens.add({ targets: scene.rim, scaleX:1.18, scaleY:0.75, duration:110, delay:150, yoyo:true, ease:'Quad.easeOut' });
  scene.cameras.main.shake(150, 0.006);
  scene.cameras.main.zoomTo(1.37, 260, 'Sine.easeOut');
  scene.time.delayedCall(150, () => burst(scene, scene.rim.x, scene.rim.y, scene.cfg.theme.accent, 18));
  sfxScore();
  sfxCrowdCheer(true);
  crowdPulse(scene, true);
  const isChampionship = scene.cfg.isBoss && roundInfo(level).isFinalBoss;
  showBanner(isChampionship ? 'CHAMPIONS!' : 'DUNK! +2', '#ff7a1a');
  scene.time.delayedCall(550, () => {
    scene.cameras.main.zoomTo(1.12, 320, 'Sine.easeIn');
    if (isChampionship){
      addScore(300);
      openOverlay('CHAMPION!', `You won it all! Final score this run: ${score}. A new season begins next.`, 'New Season', () => {
        level += 1; lives = 3; restartLevel(scene);
      });
    } else {
      openOverlay('SCORE!', `Drove it all the way — level ${level} complete.`, 'Next Level', () => {
        level += 1; lives = 3; restartLevel(scene);
      });
    }
  });
}

function restartLevel(scene){
  document.getElementById('overlay').style.display = 'none';
  scene.scene.restart();
}

function renderLives(){
  const box = document.getElementById('lives');
  box.innerHTML = '';
  for (let i=0;i<3;i++){
    const d = document.createElement('div');
    d.className = 'life' + (i < lives ? '' : ' dead');
    box.appendChild(d);
  }
}

function fmtPct(m, a){
  if (a === 0) return '.000';
  return (m/a).toFixed(3).replace(/^0\./, '.');
}

function openOverlay(title, sub, btnLabel, onClick){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovSub').textContent = sub;
  document.getElementById('bsScore').textContent = score;
  document.getElementById('bsPts').textContent = stats.points;
  document.getElementById('bsFG').textContent = `${stats.fgm}-${stats.fga}`;
  document.getElementById('bsFGPct').textContent = fmtPct(stats.fgm, stats.fga);
  document.getElementById('bs3PT').textContent = `${stats.tpm}-${stats.tpa}`;
  document.getElementById('bs3PTPct').textContent = fmtPct(stats.tpm, stats.tpa);
  document.getElementById('bsStreak').textContent = sessionBestStreak;
  const btn = document.getElementById('ovBtn');
  btn.textContent = btnLabel;
  btn.onclick = onClick;
  document.getElementById('overlay').style.display = 'flex';
  try { window.parent.postMessage({ type: 'GAME_OVER', score: score, bestStreak: sessionBestStreak, roundsPlayed: level, fgm: stats.fgm, fga: stats.fga, tpm: stats.tpm, tpa: stats.tpa, dunks: stats.dunks }, '*'); } catch(e) {}
}

function setControlMode(shootActive, pastLine){
  document.getElementById('moveGroup').style.display = shootActive ? 'none' : 'block';
  const shootBtn = document.getElementById('shoot');
  shootBtn.style.display = shootActive ? 'flex' : 'none';
  if (shootActive) shootBtn.textContent = pastLine ? 'MID' : '3PT';
}

// ---------- input ----------
let sceneRef = null;
document.getElementById('hooperPick0').addEventListener('pointerdown', () => { if (sceneRef) sceneRef.pickHooper(0); });
document.getElementById('hooperPick1').addEventListener('pointerdown', () => { if (sceneRef) sceneRef.pickHooper(1); });
document.getElementById('hooperPick2').addEventListener('pointerdown', () => { if (sceneRef) sceneRef.pickHooper(2); });
document.getElementById('hooperShuffle').addEventListener('pointerdown', () => {
  if (!sceneRef || !sceneRef.hooperOptions) return;
  sceneRef.hooperOptions = [randomHooper(), randomHooper(), randomHooper()];
  sceneRef.renderHooperOptions();
});
document.getElementById('hooperLocked').addEventListener('pointerdown', () => {
  if (!receivedAvatarPalette || !sceneRef) return;
  selectedHooperPalette = receivedAvatarPalette;
  document.getElementById('hooperSelectUI').style.display = 'none';
  sceneRef.scene.restart();
});
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'PLAYER_AVATAR' && e.data.config) {
    receivedAvatarPalette = avatarConfigToGamePalette(e.data.config);
    const btn = document.getElementById('hooperLocked');
    btn.classList.add('ready');
    btn.innerHTML = '🏀 USE MY AVATAR<br><span>Tap to play as yourself!</span>';
  }
});
function queueMove(move){ queuedMove = { move, ts: Date.now() }; }
document.getElementById('crossover').addEventListener('pointerdown', ()=>queueMove(MOVES.CROSSOVER));
document.getElementById('spin').addEventListener('pointerdown', ()=>queueMove(MOVES.SPIN));
document.getElementById('hesi').addEventListener('pointerdown', ()=>queueMove(MOVES.HESI));
document.getElementById('behindback').addEventListener('pointerdown', ()=>queueMove(MOVES.BEHINDBACK));
document.getElementById('inandout').addEventListener('pointerdown', ()=>queueMove(MOVES.INANDOUT));
document.getElementById('comboBtn').addEventListener('pointerdown', () => { if (sceneRef) useSuperMove(sceneRef); });
document.getElementById('bossPrompt').addEventListener('pointerdown', hitBossPrompt);
const shootBtn = document.getElementById('shoot');
shootBtn.addEventListener('pointerdown', () => { if (sceneRef) sceneRef.startShot(); });
shootBtn.addEventListener('pointerup', () => { if (sceneRef) sceneRef.releaseShot(); });
shootBtn.addEventListener('pointerleave', () => { if (sceneRef) sceneRef.releaseShot(); });
shootBtn.addEventListener('pointercancel', () => { if (sceneRef) sceneRef.releaseShot(); });
document.getElementById('left').addEventListener('pointerdown', () => { if (sceneRef) sceneRef.shiftLane(-1); });
document.getElementById('right').addEventListener('pointerdown', () => { if (sceneRef) sceneRef.shiftLane(1); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'a' || e.key === 'ArrowLeft') { if (sceneRef) sceneRef.shiftLane(-1); }
  if (e.key === 'd' || e.key === 'ArrowRight') { if (sceneRef) sceneRef.shiftLane(1); }
  if (e.key === 'j') queueMove(MOVES.SPIN);
  if (e.key === 'k') queueMove(MOVES.CROSSOVER);
  if (e.key === 'h') queueMove(MOVES.HESI);
  if (e.key === 'b') queueMove(MOVES.BEHINDBACK);
  if (e.key === 'i') queueMove(MOVES.INANDOUT);
  if (e.key === 'c') { if (sceneRef) useSuperMove(sceneRef); }
  if ((e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp') && !e.repeat) { if (sceneRef) sceneRef.startShot(); }
});
window.addEventListener('keyup', (e) => {
  if (e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp') { if (sceneRef) sceneRef.releaseShot(); }
});

  scene: [Main]
};
new Phaser.Game(config);
